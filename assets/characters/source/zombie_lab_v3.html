<style>
/* Layout: full-bleed 3D stage with a floating control column (bottom sheet on phones). Single committed dark studio look. */
:root {
  --bg: #14170f;
  --panel: rgba(18, 21, 14, 0.88);
  --raised: #1f2518;
  --line: #313a27;
  --fg: #e7ead9;
  --muted: #98a184;
  --accent: #8dff6e;      /* the zombies' eye glow */
  --accent-ink: #10200a;
  --blood: #b02a2a;
  --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); overflow: hidden; }
.app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

.panel {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: 304px;
  max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex; flex-direction: column; gap: 14px;
  padding: 16px;
  scrollbar-width: thin;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: 0.02em; text-wrap: balance; }
.brand h1 b { color: var(--accent); font-weight: 800; }
.brand span { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.sec { display: flex; flex-direction: column; gap: 7px; }
.label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.label em { font-style: normal; font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--fg); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button, .btn {
  font: 500 12px/1 var(--ui); color: var(--fg); background: transparent; border: 0; border-radius: 5px;
  padding: 8px 6px; cursor: pointer; white-space: nowrap;
}
.seg button:hover { background: #2a3221; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn { background: var(--raised); border: 1px solid var(--line); padding: 8px 10px; }
.btn:hover { border-color: #4a5638; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.designs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.design {
  background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 8px 6px; cursor: pointer; color: var(--fg);
  display: flex; flex-direction: column; gap: 3px; text-align: left; font-family: var(--ui);
}
.design b { font-size: 12px; font-weight: 600; }
.design small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.design[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.swatches { display: flex; gap: 5px; flex-wrap: wrap; }
.sw { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.4); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.swlabel { font-size: 11px; color: var(--muted); width: 38px; flex: none; align-self: center; }
.swrow { display: flex; gap: 6px; }

input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; }

.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--raised); display: flex; flex-direction: column; gap: 8px; }
.card .empty { font-size: 12px; color: var(--muted); line-height: 1.45; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font: 500 11px/1 var(--ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 99px; padding: 5px 8px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 11px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.partname { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { font: 600 10px/1 var(--mono); padding: 4px 6px; border-radius: 4px; background: #2a3221; color: var(--muted); }
.badge.d1 { background: #3a2a1c; color: #e0a96d; }
.badge.d2 { background: #3e1a1a; color: #ff8b8b; }

.stats { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }
.hint {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font-family: var(--mono); font-size: 10.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 9px; pointer-events: none;
}
.tag {
  position: absolute; transform: translate(-50%, 0); pointer-events: none; text-align: center;
  font-family: var(--ui); font-size: 12px; font-weight: 600; color: var(--fg); white-space: nowrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
.tag small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10px; color: var(--muted); margin-top: 2px; }
.err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }
.only-crowd[hidden], .only-inspect[hidden] { display: none !important; }

@media (max-width: 720px) {
  .panel {
    top: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
    width: auto; max-height: 48%;
  }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">

  <aside class="panel" aria-label="Zombie design controls">

    <div class="sec">
      <div class="label">Colors</div>
      <div class="swrow"><span class="swlabel">Skin</span><div class="swatches" id="sw-skin"></div></div>
      <div class="swrow"><span class="swlabel">Top</span><div class="swatches" id="sw-top"></div></div>
      <div class="swrow"><span class="swlabel">Pants</span><div class="swatches" id="sw-pants"></div></div>
    </div>

    <div class="sec">
      <div class="label">Modular view</div>
      <div class="seg" data-group="explode">
        <button id="e-0" data-e="0" aria-pressed="true">Assembled</button>
        <button id="e-1" data-e="1" aria-pressed="false">Exploded</button>
      </div>
      <label class="check"><input type="checkbox" id="joints"> Show joints and attachment points</label>
    </div>

    <div class="sec">
      <div class="label">Animation</div>
      <div class="seg" data-group="anim">
        <button id="a-idle" data-a="idle" aria-pressed="false">Idle</button>
        <button id="a-walk" data-a="walk" aria-pressed="true">Walk</button>
        <button id="a-reach" data-a="reach" aria-pressed="false">Reach</button>
      </div>
    </div>

    <div class="sec">
      <div class="label">Lighting</div>
      <div class="seg" data-group="light">
        <button id="l-neutral" data-l="neutral" aria-pressed="true">Neutral</button>
        <button id="l-night" data-l="night" aria-pressed="false">Night</button>

    <div class="sec">

  </aside>

</div>

<script>
(function () {
"use strict";
const stageEl = document.getElementById("stage");
let selected = null;   // { zombie, slot } — the selected body part
if (!window.THREE) {
  stageEl.innerHTML = '<div class="err">The 3D library could not be loaded. Check the network connection and reload.</div>';
  return;
}

/* =====================================================================================
   UNIVERSAL BODY TEMPLATE (voxel units, feet at y = 0, facing +Z, character's left = +X)
   18 voxels tall: legs 8, torso 6, neck 1, head 3. Every module of a slot shares these
   pivots, so any head / torso / arm / leg attaches to any other.
   ===================================================================================== */
const SLOTS = ["head", "torso", "upperArmL", "forearmL", "upperArmR", "forearmR", "thighL", "shinL", "thighR", "shinR"];
const SLOT_NAME = { head: "Head", torso: "Torso", upperArmL: "L upper arm", forearmL: "L forearm", upperArmR: "R upper arm", forearmR: "R forearm",
                    thighL: "L thigh", shinL: "L shin", thighR: "R thigh", shinR: "R shin" };
const FAMILY = { head: "head", torso: "torso", upperArmL: "upperArm", forearmL: "forearm", upperArmR: "upperArm", forearmR: "forearm",
                 thighL: "thigh", shinL: "shin", thighR: "thigh", shinR: "shin" };
const SIDE = { head: 0, torso: 0, upperArmL: 1, forearmL: 1, upperArmR: -1, forearmR: -1, thighL: 1, shinL: 1, thighR: -1, shinR: -1 };
// joints: neck, shoulders, elbows, hips, knees (voxel units)
const PIVOT = { head: [0, 14, 0], torso: [0, 8, 0], upperArmL: [3, 13.5, 0], forearmL: [3, 10, 0], upperArmR: [-3, 13.5, 0], forearmR: [-3, 10, 0],
                thighL: [1.5, 8, 0], shinL: [1.5, 4, 0], thighR: [-1.5, 8, 0], shinR: [-1.5, 4, 0] };
// exploded offsets, relative to each segment's parent (legs come apart but stay on the ground)
const EXPLODE = { head: [0, 4, 0], torso: [0, 4.5, 0], upperArmL: [3.5, 0.5, 0], forearmL: [0, -1.6, 0], upperArmR: [-3.5, 0.5, 0], forearmR: [0, -1.6, 0],
                  thighL: [1.6, 2.2, 0], shinL: [0, -2.2, 0], thighR: [-1.6, 2.2, 0], shinR: [0, -2.2, 0] };
const PARENT = { head: "torso", torso: null, upperArmL: "torso", forearmL: "upperArmL", upperArmR: "torso", forearmR: "upperArmR",
                 thighL: null, shinL: "thighL", thighR: null, shinR: "thighR" };

/* ---------------- deterministic randomness ---------------- */
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hash3(x, y, z, s) { let h = Math.imul(Math.round(x * 2) + 1000, 73856093) ^ Math.imul(Math.round(y * 2) + 1000, 19349663) ^ Math.imul(Math.round(z * 2) + 1000, 83492791) ^ s; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
let seedCounter = (Date.now() & 0xffff) * 7;
const newSeed = () => (seedCounter = (seedCounter * 1103515245 + 12345) >>> 0);

/* ---------------- palettes (muted clothing, greenish skin) ---------------- */
const SKINS = ["#9fae55", "#8a9b4c", "#b2b46a", "#7f9358", "#a3a86b", "#94a77a", "#b8b07a", "#6e8550"];
const TOPS = ["#556b3a", "#7a6a3a", "#6e4434", "#4c5560", "#5c3138", "#5f5f58", "#3f5a54", "#36394a", "#7d7360"];
const PANTS = ["#3b4656", "#2f3136", "#6d6650", "#4a3c2f", "#3c4434", "#55504a"];
const SHIRTS = ["#b9b6a0", "#a7a99a", "#c2b9a0", "#9fa9a8"];
const HAIRS = ["#2b241e", "#5a4630", "#1e1e22", "#8c7a5c", "#6a3b23", "#3b3330"];
const TIES = ["#6b1f26", "#2c3a5c", "#3f4a2a"];
const HATS = ["#6b2a2a", "#384a5a", "#5a5a2e", "#2f2f33", "#7a5a2a"];
const SHOES = ["#2a2420", "#3a332c", "#1f1d1d"];
const FIXED = { blood: "#6e1414", bloodDark: "#3f0a0b", gore: "#5a0d14", bone: "#d6ccab", boneDark: "#a99d7c", meat: "#8a2424", meatDark: "#561216", mouth: "#1a0c0e", belt: "#2b241f" };

function randomPalette(rng) {
  return { skin: pick(rng, SKINS), top: pick(rng, TOPS), top2: pick(rng, SHIRTS), pants: pick(rng, PANTS), hair: pick(rng, HAIRS),
           tie: pick(rng, TIES), hat: pick(rng, HATS), shoe: pick(rng, SHOES) };
}

/* ---------------- voxel module library ----------------
   build(v, s, ctx): v.box(x0,x1,y0,y1,z0,z1,tag) / v.set / v.del use voxel CENTRES in body space.
   s = +1 for the left side (+X), -1 for the right side.  decay: 0 intact, 1 damaged, 2 decomposed. */
/* Limb segments, one voxel per row. A column helper takes the tags from top to bottom.
   Arms: 1x1 thick, x = 3s. Upper arm rows y 13.5..10.5, forearm rows 9.5..7.5 + one-block hand at 6.5.
   Legs: 2x2 thick, x = s*{1,2}. Thigh rows 7.5..4.5, shin rows 3.5..1.5 + one-block foot at 0.5 (with a toe). */
function armCol(v, s, yTop, tags) { tags.forEach((t, i) => { if (t) v.set(3 * s, yTop - i, 0, t); }); }
function legRow(v, s, y, tag, only) {   // only: "inner" | "front" | "innerFront" limits which of the 4 cells get the tag
  const inner = s, outer = 2 * s;
  for (const x of [inner, outer]) for (const z of [-0.5, 0.5]) {
    if (only === "inner" && x !== inner) continue;
    if (only === "front" && z < 0) continue;
    if (only === "innerFront" && (x !== inner || z < 0)) continue;
    v.set(x, y, z, tag);
  }
}
function legRows(v, s, yTop, tags) { tags.forEach((t, i) => { if (t) legRow(v, s, yTop - i, t); }); }
function shoe(v, s, tag) { legRow(v, s, 0.5, tag); v.set(s, 0.5, 1.5, tag); v.set(2 * s, 0.5, 1.5, tag); }
const forearmMissing = (ctx, s) => ctx.spec && ctx.spec.modules[s > 0 ? "forearmL" : "forearmR"] === "missing";

const MODULES = {
  head: [
    { id: "bald", name: "Bald", decay: 0, build(v) { headBase(v); v.box(-1, 1, 17.5, 17.5, -1, 1, "skinDark"); v.box(-1, 1, 17.5, 17.5, -1, 0, "skin"); } },
    { id: "short_hair", name: "Short hair", decay: 0, build(v) { headBase(v); v.box(-1, 1, 17.5, 17.5, -1, 1, "hair"); v.box(-1, 1, 16.5, 16.5, -1, -1, "hair"); } },
    { id: "long_hair", name: "Long hair", decay: 0, build(v) { headBase(v); v.box(-1, 1, 17.5, 17.5, -1, 1, "hair"); v.box(-1, 1, 15.5, 16.5, -1, -1, "hair"); v.box(-1, 1, 14.5, 14.5, -1, -1, "hair"); v.set(-1, 16.5, 0, "hair"); v.set(1, 16.5, 0, "hair"); } },
    { id: "beanie", name: "Beanie", decay: 0, build(v) { headBase(v); v.box(-1, 1, 17.5, 17.5, -1, 1, "hatDark"); v.box(-1, 1, 18.5, 18.5, -1, 1, "hat"); } },
    { id: "scalp_wound", name: "Scalp wound", decay: 1, build(v) { headBase(v); v.box(-1, 1, 17.5, 17.5, -1, 1, "hair"); v.box(-1, 0, 17.5, 17.5, 0, 1, "gore"); v.set(-1, 17.5, -1, "blood"); v.set(0, 16.5, 1, "blood"); v.set(0, 15.5, 1, "bloodDark"); } },
    { id: "one_eye", name: "Lost eye", decay: 1, build(v) { headBase(v); v.box(-1, 1, 17.5, 17.5, -1, 0, "hair"); v.set(1, 16.5, 1, "mouth"); v.set(1, 15.5, 1, "blood"); v.set(1, 17.5, 1, "bloodDark"); } },
    { id: "jawless", name: "Missing jaw", decay: 2, build(v) { headBase(v); v.box(-1, 1, 17.5, 17.5, -1, 1, "skinDark"); v.del(0, 15.5, 1); v.set(-1, 15.5, 1, "bone"); v.set(1, 15.5, 1, "bone"); v.set(0, 15.5, 0, "gore"); v.set(0, 14.5, 0, "blood"); v.set(0, 14.5, 1, "gore"); } },
    { id: "skull", name: "Half skull", decay: 2, build(v) { headBase(v); v.box(-1, -1, 15.5, 17.5, 0, 1, "bone"); v.box(-1, 0, 17.5, 17.5, -1, 1, "bone"); v.set(-1, 16.5, 1, "eye"); v.set(0, 17.5, 1, "gore"); v.set(0, 15.5, 1, "bone"); v.box(1, 1, 17.5, 17.5, -1, 1, "hair"); } },
  ],

    const colorFn = c => {
      const b = tagColor(c.tag, spec);
      const f = 1 + (hash3(c.x, c.y, c.z, seedN) - 0.5) * 2 * amp;
      return tmp.setRGB(b.r * f, b.g * f, b.b * f);

    part.mesh = new THREE.Mesh(body.geo, bodyMat);

    part.group.add(part.mesh);
    const eyes = meshVoxels(v, pv, c => c.tag === "eye", () => tmp.setRGB(1, 1, 1));
    if (eyes.faces) { part.eyes = new THREE.Mesh(eyes.geo, eyeMat); part.eyes.userData = { zombie: this, slot }; part.group.add(part.eyes); }
    else eyes.geo.dispose();
    let minY = 1e9, maxY = -1e9, minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (const c of v.map.values()) { minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x); minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y); minZ = Math.min(minZ, c.z); maxZ = Math.max(maxZ, c.z); }
    part.voxels = v.map.size;
    part.size = [maxX - minX + 1, maxY - minY + 1, maxZ - minZ + 1];
    part.top = maxY + 0.5;
    part.tris = body.faces * 2 + eyes.faces * 2;
    if (selected && selected.zombie === this && selected.slot === slot) part.mesh.material = selectMat;
  }
  get voxels() { let n = 0; for (const s of SLOTS) n += this.parts[s].voxels; return n; }
  get tris() { let n = 0; for (const s of SLOTS) n += this.parts[s].tris; return n; }
  get height() { return Math.max(this.parts.head.top, this.parts.torso.top); }
  update(dt, t, mode, explodeTarget) {
    this.explode += (explodeTarget - this.explode) * Math.min(1, dt * 6);
    const e = this.explode, amp = 1 - e;
    // part placement: pivot + exploded offset (children positioned relative to the torso pivot)
    for (const slot of SLOTS) {
      const parent = PARENT[slot];
      const base = parent ? sub(PIVOT[slot], PIVOT[parent]) : PIVOT[slot];
      const ex = EXPLODE[slot];
      this.parts[slot].group.position.set(base[0] + ex[0] * e, base[1] + ex[1] * e, base[2] + ex[2] * e);
    }
    const P = this.parts, T = {};
    for (const s of SLOTS) T[s] = [0, 0, 0];
    let bob = 0;
    if (mode === "walk") {
      const ph = this.phase + t * this.speed * 4.6;
      // hips swing, knees bend on the forward swing (positive x-rotation bends the shin backwards)
      T.thighL[0] = Math.sin(ph) * 0.5; T.thighR[0] = -Math.sin(ph) * 0.5;
      T.shinL[0] = Math.max(0, Math.cos(ph)) * 0.75; T.shinR[0] = Math.max(0, -Math.cos(ph)) * 0.75;
      // zombie reach: upper arms forward, forearms droop slightly at the elbow
      T.upperArmL[0] = -1.3 + 0.12 * Math.sin(ph * 0.5 + 1.1); T.upperArmR[0] = -1.22 + 0.12 * Math.sin(ph * 0.5);
      T.forearmL[0] = 0.18 + 0.12 * Math.sin(ph * 0.5 + 2); T.forearmR[0] = 0.25 + 0.12 * Math.sin(ph * 0.5 + 0.4);
      T.upperArmL[2] = 0.07; T.upperArmR[2] = -0.07;
      T.torso[0] = 0.14; T.torso[1] = Math.sin(ph) * 0.07;
      T.head[0] = 0.12; T.head[2] = Math.sin(ph * 0.5) * 0.14;
      bob = Math.abs(Math.sin(ph)) * 0.3;
    } else if (mode === "reach") {
      const ph = this.phase + t * 2.3 * this.speed;
      T.upperArmL[0] = -1.75 + 0.3 * Math.sin(ph); T.upperArmR[0] = -1.75 + 0.3 * Math.sin(ph + Math.PI);
      T.forearmL[0] = -0.15 - 0.35 * Math.max(0, Math.sin(ph + 0.6)); T.forearmR[0] = -0.15 - 0.35 * Math.max(0, Math.sin(ph + Math.PI + 0.6));   // grasping
      T.upperArmL[2] = 0.14 + 0.1 * Math.sin(ph * 1.3); T.upperArmR[2] = -(0.14 + 0.1 * Math.sin(ph * 1.3 + 1));
      T.torso[0] = 0.3 + 0.06 * Math.sin(ph * 0.5); T.torso[2] = 0.07 * Math.sin(ph * 0.4);
      T.head[0] = -0.22; T.head[1] = 0.25 * Math.sin(ph * 0.3);
      T.thighL[0] = -0.25; T.shinL[0] = 0.35; T.thighR[0] = 0.2; T.shinR[0] = 0.15;          // braced stance
      bob = 0.1 * Math.sin(ph);
    } else {
      const ph = this.phase + t * 1.1;
      T.upperArmL[0] = -0.15 + 0.05 * Math.sin(ph); T.upperArmR[0] = -0.1 + 0.05 * Math.sin(ph + 2);
      T.forearmL[0] = -0.3; T.forearmR[0] = -0.2;                                                 // limp bend at the elbows
      T.upperArmL[2] = 0.05; T.upperArmR[2] = -0.05;
      T.thighR[0] = -0.12; T.shinR[0] = 0.22;                                                     // weight on one leg
      T.torso[0] = 0.08; T.torso[2] = 0.05 * Math.sin(ph * 0.7);

}

const LIGHTING = {
  neutral: { bg: "#6c7652", ground: "#6c7652", fog: [140, 420], hemi: ["#e8f0d8", "#4d5638", 0.95], key: ["#fff2dc", 1.1, [26, 42, 22]],

  night:   { bg: "#1d1830", ground: "#221c33", fog: [90, 300], hemi: ["#6a5aa0", "#160f22", 0.42], key: ["#9fb2ff", 0.75, [-22, 44, 18]],
             fill: ["#5b3d7a", 0.2, [24, 10, -16]], lamp: 2.2, bloom: [1.15, 0.72], groundRough: 0.62 },

function addZombie(z, x, zpos, yaw) { z.root.position.set(x, 0, zpos); z.root.rotation.y = yaw || 0; z.setJoints(state.joints); scene.add(z.root); zombies.push(z); }

function buildLineup() {
  if (!lineup) lineup = ["drone", "walker", "rotter"].map(id => new Zombie(designSpec(id)));
  return lineup;
}
function buildCrowd() {
  if (crowd) return crowd;
  const rng = mulberry32(newSeed());
  const tier = activeTierForCrowd;
  const pts = [];
  for (let i = 0; i < 600 && pts.length < 18; i++) {
    const r = Math.sqrt(rng()) * 30, a = rng() * Math.PI * 2;
    const p = [Math.cos(a) * r * 1.25, Math.sin(a) * r * 0.85];
    if (pts.every(q => Math.hypot(q[0] - p[0], q[1] - p[1]) > 6.8)) pts.push(p);
  }
  crowd = pts.map(p => { const z = new Zombie(randomSpec(rng, tier)); z.pos = p; z.yaw = (rng() - 0.5) * 1.3; return z; });
  return crowd;
}
let activeTierForCrowd = null;

let camGoal = null;
function setView(v, instant) {
  state.view = v;
  clearScene();
  if (selected && !zombieVisibleAfter(v, selected.zombie)) select(null);
  if (v === "inspect") {
    addZombie(hero, 0, 0, 0);
    shadowExtent = 16; shadowCenter.set(0, 0, 0);
    camGoal = { target: [0, 9.5, 0], pos: [26, 20, 44] };
  } else if (v === "lineup") {
    buildLineup().forEach((z, i) => addZombie(z, (i - 1) * 14, 0, 0));
    shadowExtent = 30; shadowCenter.set(0, 0, 0);
    camGoal = { target: [0, 9, 0], pos: [30, 22, 70] };
    tagEls = lineup.map(z => { const d = document.createElement("div"); d.className = "tag"; tagsEl.appendChild(d); return d; });
  } else {
    if (state.joints) { state.joints = false; $("joints").checked = false; }   // markers clutter a crowd
    buildCrowd().forEach(z => addZombie(z, z.pos[0], z.pos[1], z.yaw));
    shadowExtent = 52; shadowCenter.set(0, 0, 0);
    camGoal = { target: [0, 8, 0], pos: [46, 38, 96] };
  }
  placeShadowCamera();
  if (instant) { controls.target.set(...camGoal.target); camera.position.set(...camGoal.pos); camGoal = null; }
  else camGoal.t = 0;
  syncUI();
}
function zombieVisibleAfter(v, z) { return v === "inspect" ? z === hero : v === "lineup" ? (lineup || []).includes(z) : (crowd || []).includes(z); }

function select(sel) {
  if (selected) { const p = selected.zombie.parts[selected.slot]; if (p.mesh) p.mesh.material = bodyMat; }
  selected = sel;
  if (selected) { const p = selected.zombie.parts[selected.slot]; if (p.mesh) p.mesh.material = selectMat; }
  syncUI();
}
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const meshes = [];
  for (const z of zombies) for (const s of SLOTS) { const p = z.parts[s]; if (p.mesh) meshes.push(p.mesh); if (p.eyes) meshes.push(p.eyes); }
  const hit = ray.intersectObjects(meshes, false)[0];
  select(hit ? { zombie: hit.object.userData.zombie, slot: hit.object.userData.slot } : null);
});

  if (composer) { composer.setSize(w, h); composer.setPixelRatio && composer.setPixelRatio(renderer.getPixelRatio()); }
  if (bloom) bloom.setSize(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}

const clock = new THREE.Clock();
const v3 = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (camGoal) {
    camGoal.t += dt / 0.7;
    const k = Math.min(1, camGoal.t), s = k * k * (3 - 2 * k);
    controls.target.lerp(v3.set(...camGoal.target), s * 0.25 + 0.02);
    camera.position.lerp(v3.set(...camGoal.pos), s * 0.25 + 0.02);
    if (k >= 1 && camera.position.distanceTo(v3.set(...camGoal.pos)) < 0.5) camGoal = null;
  }
  controls.update();
  for (const z of zombies) z.update(dt, t, state.anim, state.explode);
  if (state.view === "lineup" && lineup) {
    const r = renderer.domElement.getBoundingClientRect();
    lineup.forEach((z, i) => {
      const el = tagEls[i]; if (!el) return;
      v3.set(z.root.position.x, -1.2, z.root.position.z + 2).project(camera);
      el.style.left = ((v3.x + 1) / 2 * r.width) + "px"; el.style.top = ((1 - v3.y) / 2 * r.height) + "px";
      el.style.visibility = v3.z < 1 ? "visible" : "hidden";
      el.innerHTML = z.spec.name + "<small>" + DETAIL_NAME[z.spec.detail] + " detail · " + z.voxels + " voxels</small>";
    });
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
}
if (composer) renderer.outputEncoding = THREE.LinearEncoding;   // gamma applied by the final pass
applyLighting("neutral");
resize();
setView("inspect", true);
frame();
})();
</script>
