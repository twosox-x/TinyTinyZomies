<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Military Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Same studio look as Zombie Lab v3: full-bleed stage, floating control column. */
:root {
  --bg: #14170f; --panel: rgba(18, 21, 14, 0.88); --raised: #1f2518; --line: #313a27; --fg: #e7ead9; --muted: #98a184;
  --accent: #c9b46a; --accent-ink: #1d1a0c;
  --ui: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark; box-sizing: border-box;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px var(--ui); overflow: hidden; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
.panel { position: absolute; top: 16px; left: 16px; width: 316px; max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 13px; padding: 16px; scrollbar-width: thin; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: 0.02em; }
.brand h1 b { color: var(--accent); }
.brand span { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.sec { display: flex; flex-direction: column; gap: 7px; }
.label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.label em { font-style: normal; font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--fg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button, .btn { font: 500 12px/1 var(--ui); color: var(--fg); background: transparent; border: 0; border-radius: 5px; padding: 8px 4px; cursor: pointer; white-space: nowrap; }
.seg button:hover { background: #2a3221; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn { background: var(--raised); border: 1px solid var(--line); padding: 8px 10px; }
.btn:hover { border-color: #4a5638; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.list { display: flex; flex-direction: column; gap: 8px; }
.grp b { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font: 500 11px/1 var(--ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 99px; padding: 5px 8px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 11px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); text-align: right; }
.hint { position: absolute; right: 16px; bottom: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; pointer-events: none; }
#labels .tag { position: absolute; transform: translate(-50%, 0); pointer-events: none; font: 600 11px var(--ui); color: var(--fg); white-space: nowrap; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
@media (max-width: 720px) { .panel { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 48%; } .hint { display: none; } }
</style></head><body>
<div id="stage" aria-label="3D preview: drag to rotate, scroll to zoom"></div>
<div id="labels"></div>
<aside class="panel" aria-label="Military asset controls">
  <div class="brand"><h1>Tiny Tiny <b>Military</b> Lab</h1><span>v1 · models</span></div>
  <div class="sec"><div class="label">Mode</div>
    <div class="seg" data-group="mode"><button data-v="single" aria-pressed="true">Asset</button><button data-v="lineup" aria-pressed="false">Lineup</button><button data-v="props" aria-pressed="false">Props</button><button data-v="rts" aria-pressed="false">RTS</button></div></div>
  <div class="sec"><div class="label">Camera</div>
    <div class="seg" data-group="view"><button data-v="persp" aria-pressed="true">3/4</button><button data-v="front" aria-pressed="false">Front</button><button data-v="side" aria-pressed="false">Side</button><button data-v="rear" aria-pressed="false">Rear</button><button data-v="top" aria-pressed="false">Top</button></div></div>
  <div class="sec"><div class="label">Pose (infantry)</div>
    <div class="seg" data-group="pose"><button data-v="carry" aria-pressed="true">Carry</button><button data-v="rest" aria-pressed="false">Rest (template)</button></div></div>
  <div class="sec"><div class="label">Lighting</div>
    <div class="seg" data-group="light"><button data-v="neutral" aria-pressed="true">Neutral</button><button data-v="night" aria-pressed="false">Night</button></div></div>
  <div class="sec">
    <label class="check"><input type="checkbox" id="zombie" checked> Zombie beside it (scale)</label>
    <label class="check"><input type="checkbox" id="points"> Joints, grip / support points, sockets</label>
    <label class="check"><input type="checkbox" id="open"> Doors / gates open</label>
  </div>
  <div class="sec"><div class="label">Asset <em id="cur"></em></div><div class="list" id="assets"></div></div>
  <div class="sec"><div class="label">Info</div><dl class="kv" id="info"></dl></div>
  <div class="row"><button class="btn" id="export">Export JSON (all models)</button></div>
</aside>
<div class="hint">drag rotate · scroll zoom · right-drag pan</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
"use strict";
if (!window.THREE) { document.getElementById("stage").innerHTML = '<p style="padding:40px;color:#98a184">The 3D library could not be loaded.</p>'; return; }
/* === MILITARY LIBRARY BEGIN === */
/* Renderer-free model library (also evaluated by tools/convert_military.mjs in a Node vm sandbox).
   Conventions: Y up, front = +Z, model's left = +X. Infantry authored in body-voxel units (V = 1.7/18 m),
   body segments with 1 V cells (Zombie Lab layout), gear and weapons with 0.5 V cells. Props in 5 cm cells. */
const MIL_VERSION = 1;
const V_M = 1.7 / 18, FINE_M = V_M / 2, PROP_M = 0.05;

/* ---------------- deterministic randomness (same functions as Zombie Lab) ---------------- */
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hash3(x, y, z, s) { let h = Math.imul(Math.round(x * 2) + 1000, 73856093) ^ Math.imul(Math.round(y * 2) + 1000, 19349663) ^ Math.imul(Math.round(z * 2) + 1000, 83492791) ^ s; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

/* ---------------- palette (sRGB). flags: 1 emissive, 2 metal, 4 glass ---------------- */
const PALETTE = [];
const PAL = {};
function pal(name, rgb, noise, flags) { PAL[name] = PALETTE.length; PALETTE.push({ name, rgb, noise: noise === undefined ? 0.06 : noise, flags: flags || 0 }); }
// uniforms / gear
pal("olive", "#5b5f3a"); pal("oliveDark", "#3f4229"); pal("oliveLight", "#767a4d");
pal("coyote", "#8a7352"); pal("coyoteDark", "#675539"); pal("coyoteLight", "#a48b66");
pal("rangerGreen", "#4c5440"); pal("rangerDark", "#363c2e");
pal("mcTan", "#a08c68"); pal("mcGreen", "#6b6f4a"); pal("mcBrown", "#6e5a40"); pal("mcLight", "#bba886");
pal("webbing", "#55513a"); pal("tan", "#b59f78"); pal("khaki", "#9c8a62");
pal("black", "#1f2021", 0.05); pal("blackSoft", "#2d2e2c", 0.05); pal("bootBrown", "#5a4630");
pal("gunBlack", "#1a1b1d", 0.04, 2); pal("gunMetal", "#3b3d40", 0.04, 2); pal("metal", "#7d8186", 0.04, 2);
pal("brass", "#b8913a", 0.05, 2); pal("lens", "#2c4a5e", 0.02, 4); pal("lensGlint", "#6fa0bd", 0.02, 4);
pal("suppressor", "#4a4b47", 0.04, 2); pal("fde", "#a58f6b"); pal("eyeDark", "#17140f", 0.0); pal("lip", "#6e4a3a", 0.03);
pal("scarfTan", "#b8a887"); pal("scarfOlive", "#6d6b4c"); pal("scarfBlack", "#2b2b2b");
pal("ghillieA", "#6f6a45"); pal("ghillieB", "#8c7c55"); pal("ghillieC", "#4d5233");
pal("stencil", "#d9cf9e", 0.02); pal("stencilYellow", "#c9a930", 0.02);
// skin tones (realistic, NOT the zombie greens)
const SKIN_TONES = ["#e0b294", "#c99a76", "#a5764f", "#7f5538", "#5e3d29", "#d6a47c"];
SKIN_TONES.forEach((c, i) => { pal("skin" + i, c, 0.04); });
const SKIN_DARK = SKIN_TONES.map(c => { const n = parseInt(c.slice(1), 16); const f = v => Math.round(v * 0.78).toString(16).padStart(2, "0"); return "#" + f((n >> 16) & 255) + f((n >> 8) & 255) + f(n & 255); });
SKIN_DARK.forEach((c, i) => pal("skinDark" + i, c, 0.04));
const HAIR = ["#2b241e", "#5a4630", "#1e1e22", "#8c7a5c"];
HAIR.forEach((c, i) => pal("hair" + i, c, 0.04));
// props
pal("sand", "#b9a57a", 0.08); pal("sandDark", "#9c8961", 0.08); pal("hescoWire", "#6e6c62", 0.05, 2); pal("hescoFabric", "#c2b48c", 0.06);
pal("sandbag", "#a99a70", 0.09); pal("sandbagDark", "#8a7c56", 0.09); pal("sandbagOlive", "#7b7650", 0.09);
pal("wood", "#8a6a44", 0.08); pal("woodDark", "#6a4f31", 0.08); pal("woodLight", "#a88a5e", 0.08); pal("rope", "#b9a77f", 0.05);
pal("steel", "#5d6166", 0.05, 2); pal("steelDark", "#43474b", 0.05, 2); pal("rust", "#6e4a33", 0.08);
pal("containerOlive", "#55593a", 0.04, 2); pal("containerDark", "#3d402b", 0.04, 2);
pal("canopyOlive", "#6a6d48", 0.04); pal("canopyDark", "#53563a", 0.04); pal("canopyTan", "#a6956d", 0.04); pal("canopyWhite", "#d2d0c2", 0.04);
pal("line", "#cfc8ae", 0.02); pal("strap", "#4b4a36", 0.04);
pal("canvas", "#857a58", 0.06); pal("canvasLight", "#a79b77", 0.06);
pal("white", "#e6e4da", 0.03); pal("medGreen", "#2f8a4a", 0.03); pal("flagOlive", "#5d6440", 0.03); pal("flagWhite", "#e2e0d6", 0.03);
pal("pole", "#6a6c6e", 0.03, 2); pal("concrete", "#9a978d", 0.06); pal("radioGreen", "#3f4630", 0.04);
pal("cotGreen", "#5f6646", 0.05); pal("mattress", "#7a7d62", 0.05); pal("blanket", "#6b5a40", 0.05);

/* ---------------- voxel set: cells of edge `size` with arbitrary centres on one lattice ---------------- */
const vkey = (x, y, z) => Math.round(x * 4) + "," + Math.round(y * 4) + "," + Math.round(z * 4);
function makeSet(size) {
  const map = new Map();
  return {
    size, map,
    set(x, y, z, m) { if (m === undefined || m === null) throw new Error("no material"); map.set(vkey(x, y, z), { x, y, z, m }); },
    del(x, y, z) { map.delete(vkey(x, y, z)); },
    has(x, y, z) { return map.has(vkey(x, y, z)); },
    get(x, y, z) { return map.get(vkey(x, y, z)); },
    // fill the region between EDGES [x0,x1]x[y0,y1]x[z0,z1] (set units) with cells of this set's size
    ebox(x0, x1, y0, y1, z0, z1, m) {
      const s = size, h = s / 2;
      for (let x = x0 + h; x < x1 - 1e-6; x += s) for (let y = y0 + h; y < y1 - 1e-6; y += s) for (let z = z0 + h; z < z1 - 1e-6; z += s) this.set(x, y, z, m);
    },
    // inclusive cell-centre box (Zombie Lab style, unit cells)
    box(x0, x1, y0, y1, z0, z1, m) { for (let x = x0; x <= x1 + 1e-6; x += size) for (let y = y0; y <= y1 + 1e-6; y += size) for (let z = z0; z <= z1 + 1e-6; z += size) this.set(x, y, z, m); },
    paint(fn) { for (const c of map.values()) { const r = fn(c); if (r) c.m = r; } },
  };
}

/* =====================================================================================
   INFANTRY — body template identical to Zombie Lab v3 (18 V tall, 10 segments)
   ===================================================================================== */
const SLOTS = ["head", "torso", "upperArmL", "forearmL", "upperArmR", "forearmR", "thighL", "shinL", "thighR", "shinR"];
const SIDE = { head: 0, torso: 0, upperArmL: 1, forearmL: 1, upperArmR: -1, forearmR: -1, thighL: 1, shinL: 1, thighR: -1, shinR: -1 };
const PIVOT = { head: [0, 14, 0], torso: [0, 8, 0], upperArmL: [3, 13.5, 0], forearmL: [3, 10, 0], upperArmR: [-3, 13.5, 0], forearmR: [-3, 10, 0],
                thighL: [1.5, 8, 0], shinL: [1.5, 4, 0], thighR: [-1.5, 8, 0], shinR: [-1.5, 4, 0] };
const PARENT = { head: "torso", torso: null, upperArmL: "torso", forearmL: "upperArmL", upperArmR: "torso", forearmR: "upperArmR",
                 thighL: null, shinL: "thighL", thighR: null, shinR: "thighR" };
const FK_ORDER = ["torso", "head", "upperArmL", "forearmL", "upperArmR", "forearmR", "thighL", "shinL", "thighR", "shinR"];
const HAND = { L: [3, 6.5, 0], R: [-3, 6.5, 0] };

// Zombie Lab helpers, verbatim layout
function armCol(v, s, yTop, tags) { tags.forEach((t, i) => { if (t) v.set(3 * s, yTop - i, 0, t); }); }
function legRow(v, s, y, tag) { for (const x of [s, 2 * s]) for (const z of [-0.5, 0.5]) v.set(x, y, z, typeof tag === "function" ? tag(x, y, z) : tag); }
function legRows(v, s, yTop, tags) { tags.forEach((t, i) => { if (t) legRow(v, s, yTop - i, t); }); }
function shoe(v, s, tag) { legRow(v, s, 0.5, tag); v.set(s, 0.5, 1.5, tag); v.set(2 * s, 0.5, 1.5, tag); }

// camouflage: blocky multicam-ish pattern from a hash of the (coarse) position
const CAMO = {
  mc: ["mcTan", "mcGreen", "mcBrown", "mcTan", "mcLight", "mcTan"],
  rg: ["rangerGreen", "rangerGreen", "rangerDark", "rangerGreen"],
  olive: ["olive", "olive", "oliveDark", "olive"],
  coyote: ["coyote", "coyote", "coyoteDark", "coyote"],
  tan: ["tan", "tan", "khaki"],
  net: ["olive", "oliveDark", "olive", "webbing", "olive"],
};
function camoAt(scheme, seed, x, y, z, block) {
  const b = block || 1;
  const list = CAMO[scheme] || [scheme];
  return list[Math.floor(hash3(Math.floor(x / b + 64), Math.floor(y / b + 64), Math.floor(z / b + 64), seed) * list.length)];
}

/* ---- body modules (1 V cells). L = look ---- */
function buildBody(slot, L) {
  const v = makeSet(1), s = SIDE[slot];
  const cam = (x, y, z) => camoAt(L.uniform, L.seed, x, y, z);
  const skin = "skin" + L.skin, skinD = "skinDark" + L.skin;
  switch (slot) {
    case "head":
      v.set(0, 14.5, 0, skin);
      v.box(-1, 1, 15.5, 17.5, -1, 1, skin);
      v.box(-1, 1, 17.5, 17.5, -1, 1, "hair" + L.hair);
      v.box(-1, 1, 16.5, 16.5, -1, -1, "hair" + L.hair);
      v.set(-1, 16.5, 1, "eyeDark"); v.set(1, 16.5, 1, "eyeDark");
      v.set(0, 15.5, 1, L.beard ? "hair" + L.hair : "lip");
      if (L.beard) { v.set(-1, 15.5, 1, "hair" + L.hair); v.set(1, 15.5, 1, "hair" + L.hair); }
      break;
    case "torso":
      v.box(-2, 2, 8.5, 13.5, -1, 1, "x"); v.paint(c => cam(c.x, c.y, c.z));
      v.box(-2, 2, 8.5, 8.5, -1, 1, "webbing");          // trouser belt line
      v.set(0, 13.5, 1, skin);                            // collar opening
      break;
    case "upperArmL": case "upperArmR":
      armCol(v, s, 13.5, [1, 1, 1, 1].map((_, i) => L.rolled && i === 3 ? (L.uniform === "mc" ? "mcLight" : "tan") : cam(3 * s, 13.5 - i, 0)));
      break;
    case "forearmL": case "forearmR": {
      const glove = L.gloves ? L.gloves : skin;
      if (L.rolled) armCol(v, s, 9.5, [skin, skin, skinD, glove]);
      else armCol(v, s, 9.5, [cam(3 * s, 9.5, 0), cam(3 * s, 8.5, 0), cam(3 * s, 7.5, 1), glove]);
      break;
    }
    case "thighL": case "thighR":
      legRows(v, s, 7.5, [cam, cam, cam, cam]);
      break;
    case "shinL": case "shinR":
      legRows(v, s, 3.5, [cam, cam, L.boot]);
      shoe(v, s, L.boot);
      break;
  }
  return v;
}

/* ---- gear (0.5 V cells, authored by EDGES in body space) ---- */
function ring(g, y0, y1, out, inn, m, opts) {   // square ring between |x|,|z| <= out and > inn (edges), corners optional
  const cut = opts && opts.round;
  for (let x = -out + 0.25; x < out; x += 0.5) for (let z = -out + 0.25; z < out; z += 0.5) {
    if (Math.abs(x) < inn && Math.abs(z) < inn) continue;
    if (cut && Math.abs(x) > out - 0.5 && Math.abs(z) > out - 0.5) continue;
    if (opts && opts.skip && opts.skip(x, z)) continue;
    for (let y = y0 + 0.25; y < y1; y += 0.5) g.set(x, y, z, typeof m === "function" ? m(x, y, z) : m);
  }
}
function buildHeadGear(L) {
  const g = makeSet(0.5);
  const cov = (x, y, z) => camoAt(L.helmetCover, L.seed + 7, x, y, z, 0.5);
  if (L.hat === "boonie") {
    ring(g, 17, 17.5, 2.5, 1.5, cov, {});                                    // brim
    ring(g, 17.5, 18, 2, 1.5, cov, {});                                      // band
    g.ebox(-1.5, 1.5, 18, 18.5, -1.5, 1.5, "x"); g.paint(c => c.m === "x" ? cov(c.x, c.y, c.z) : null);   // crown
    ring(g, 18, 18.5, 2, 1.5, cov, { round: true });
    g.ebox(-1, 1, 18.5, 19, -1, 1, "x"); g.paint(c => c.m === "x" ? cov(c.x, c.y, c.z) : null);
    for (let x = -1.75; x < 2; x += 0.5) { g.set(x, 17.75, 1.75, "webbing"); }   // band strip front
  } else {
    // helmet shell: forehead above the eyes, ears and nape covered, rounded corners
    ring(g, 17, 18, 2, 1.5, cov, { round: true });
    ring(g, 16, 17, 2, 1.5, cov, { round: true, skip: (x, z) => z > 1.5 });      // sides and back down to the ears
    g.ebox(-1.5, 1.5, 18, 18.5, -1.5, 1.5, "x"); g.paint(c => c.m === "x" ? cov(c.x, c.y, c.z) : null);
    g.ebox(-1, 1, 18.5, 19, -1, 1, "x"); g.paint(c => c.m === "x" ? cov(c.x, c.y, c.z) : null);
    // side rails + chin strap stubs
    for (const sx of [-1, 1]) { g.ebox(sx > 0 ? 2 : -2.5, sx > 0 ? 2.5 : -2, 17, 17.5, -0.5, 0.5, "black"); g.ebox(sx > 0 ? 1.5 : -2, sx > 0 ? 2 : -1.5, 15.5, 16, 0, 0.5, "black"); }
    if (L.nvg) { g.ebox(-0.5, 0.5, 17.5, 18, 2, 2.5, "black"); g.ebox(-0.5, 0.5, 18, 18.5, 1.5, 2, "black"); }
    if (L.goggles) {
      g.ebox(-1.5, 1.5, 17, 17.5, 2, 2.5, "black");
      g.set(-0.75, 17.25, 2.25, "lens"); g.set(0.75, 17.25, 2.25, "lens"); g.set(-1.25, 17.25, 2.25, "lensGlint");
    }
    if (L.helmetCover === "net" || L.ghillie) {
      const rng = mulberry32(L.seed * 31 + 5);
      const strips = L.ghillie ? 16 : 7;
      for (let i = 0; i < strips; i++) {
        const a = rng() * Math.PI * 2, x = Math.max(-2.25, Math.min(2.25, Math.round(Math.cos(a) * 2.2 * 2 - 0.5) / 2 + 0.25));
        const z = Math.max(-2.25, Math.min(2.25, Math.round(Math.sin(a) * 2.2 * 2 - 0.5) / 2 + 0.25));
        if (z > 1.2 && Math.abs(x) < 1.6) continue;                         // keep the face clear
        const len = 1 + Math.floor(rng() * (L.ghillie ? 3 : 2));
        const m = ["ghillieA", "ghillieB", "ghillieC"][Math.floor(rng() * 3)];
        const top = 18.25;
        const ox = Math.abs(x) >= Math.abs(z) ? Math.sign(x) * 2.25 : x, oz = Math.abs(x) >= Math.abs(z) ? z : Math.sign(z) * 2.25;

  rifle:  { grip: [-1.6, 10.4, 4.6], yaw: 0.38, pitch: 0.38, roll: -0.15, torso: [0.06, 0.12, 0], head: [0.05, 0.1, 0], legs: true },
  mg:     { grip: [-2.4, 8.6, 3.6],  yaw: 0.22, pitch: 0.12, roll: -0.1, torso: [0.1, 0.18, 0], head: [-0.02, 0.12, 0], legs: true },
  sniper: { grip: [-1.6, 10.4, 4.4], yaw: 0.4, pitch: 0.55, roll: -0.15, torso: [0.05, 0.1, 0], head: [0.05, 0.1, 0], legs: true },
};
function makePoses(kind, wpn) {
  const rest = { rot: {}, weaponMount: [0, 0, 0], supportError: null };
  const C = CARRY[kind];
  const rot = { torso: C.torso.slice(), head: C.head.slice() };
  if (C.legs) { rot.thighR = [-0.08, 0, 0]; rot.shinR = [0.12, 0, 0]; rot.thighL = [0.05, 0, 0]; }
  // right hand to the grip, then the weapon orientation in forearm space
  solveArm(rot, "R", C.grip);
  const F = fk(rot);
  const Wm = mmul(eulerMat([0, C.yaw, 0]), mmul(eulerMat([C.pitch, 0, 0]), eulerMat([0, 0, C.roll])));
  const mountM = mmul(mT(F.forearmR.R), Wm);

  const sup = vadd(hand, mvec(Wm, wpn.support));

/* ---- assemble a soldier: parts in body space (V units) ---- */

  const gear = { gear_head: ["head", buildHeadGear(L)], gear_torso: ["torso", buildTorsoGear(L)] };

  for (const [n, [par, set]] of Object.entries(gear)) parts.push({ name: n, slot: null, parent: par, set, pivot: PIVOT[par], unitM: V_M, rigid: true, gearOf: par });
  const wpn = WEAPONS[def.weapon](L);

  parts.push({ name: "weapon", slot: null, parent: "forearmR", set: wpn.set, pivot: HAND.R, unitM: V_M, rigid: false, weaponSpace: true });
  const poses = makePoses(def.weapon, wpn);

    { name: "parachute", part: "torso", pos: [0, 14.5, -0.5], dir: [0, 1, 0] },

}

/* =====================================================================================

// --- parachutes: round canopy shell with gores, apex vent and skirt; lines from the skirt to the riser point
function parachute(spec) {

  const N = Math.ceil(r) + 1, colMin = new Map();

  for (let x = -N; x < N; x++) for (let z = -N; z < N; z++) {
    const cx = x + 0.5, cz = z + 0.5, d = Math.hypot(cx, cz);
    if (d > r || d < vent) continue;
    const yt = Math.floor(top(d));
    // fill down to the neighbour minimum so the shell stays watertight
    let ymin = yt;
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const dn = Math.hypot(cx + dx, cz + dz); if (dn <= r && dn >= vent) ymin = Math.min(ymin, Math.floor(top(dn)) + 1); else if (dn > r) ymin = Math.min(ymin, Math.floor(y0 + h * 0.0)); }

    const ang = Math.atan2(cz, cx), gi = Math.floor(((ang + Math.PI) / (2 * Math.PI)) * gores) % gores;
    const seam = Math.abs(((ang + Math.PI) / (2 * Math.PI)) * gores - Math.round(((ang + Math.PI) / (2 * Math.PI)) * gores)) * (2 * Math.PI * d / gores) < 0.55;
    const m = seam ? mats.seam : (gi % 2 ? mats.a : mats.b);
    for (let y = ymin; y <= yt; y++) can.set(cx, y + 0.5, cz, d > r - 1.2 ? mats.skirt : m);
  }

  const ratio = unitC / PROP_M;                                // canopy cell -> line cell
  for (let i = 0; i < gores; i++) {
    const a = (i / gores) * Math.PI * 2 - Math.PI;
    // attach under the canopy column at the skirt: the line's top cell touches the column's lowest cell from below
    const cx = Math.floor(Math.cos(a) * (r - 0.7)), cz = Math.floor(Math.sin(a) * (r - 0.7));
    const ymin = colMin.get(cx + "," + cz);
    if (ymin === undefined) throw new Error("parachute: no canopy column for a line");
    const top = [cx * ratio + 0.5, ymin * ratio - 0.5, cz * ratio + 0.5];
    const riser = [top[0] > 0 ? 3.5 : -4.5, 10, 0];
    cellLine(lines, top, riser, "line");
  }

  B(lines, -5, -4, 0, 10, 0, 0, "strap"); B(lines, 3, 4, 0, 10, 0, 0, "strap");
  B(lines, -4, 3, 0, 0, 0, 0, "strap");
  return [
    { name: "canopy", set: can, unitM: unitC, pivot: [0, 0, 0] },
    { name: "lines", set: lines, unitM: PROP_M, pivot: [0, 0, 0] },
  ];
}

  for (let x = x0 + 2; x < x1 - 1; x += 3) { B(body, x, x, 3, H - 4, z0 - 1, z0 - 1, "containerDark"); B(body, x, x, 3, H - 4, z1 + 1, z1 + 1, "containerDark"); }
  B(body, x0, x0, 2, H - 3, z0, z1, "containerOlive");                 // closed end
  for (let z = z0 + 2; z < z1 - 1; z += 3) B(body, x0 - 1, x0 - 1, 3, H - 4, z, z, "containerDark");
  // corner posts + castings
  for (const x of [x0, x1]) for (const z of [z0, z1]) { B(body, x, x, 0, H - 1, z, z, "containerDark"); }
  // door frame at +X end
  B(body, x1, x1, H - 4, H - 3, z0, z1, "containerDark"); B(body, x1, x1, 0, 1, z0, z1, "containerDark");
  // markings on the long sides
  for (const [z, d] of [[z1 + 1, 1], [z0 - 1, -1]]) {

    for (const y of [2, 18, 34]) B(body, x0 + 2, x1 - 6, y, y, z, z + 6, "woodDark");
    for (let x = x0 + 2; x <= x1 - 6; x += 20) B(body, x, x, 2, 40, z, z + 6, "steelDark");
    for (let x = x0 + 4; x < x1 - 14; x += 9) for (const y of [3, 19]) B(body, x, x + 7, y, y + 6, z + 1, z + 5, pv(5, x, y, z) < 0.5 ? "olive" : "containerOlive");

      { name: "apron", set: apron, unitM: PROP_M, pivot: [0, 0, 0] },

function barricade(kind, opening) {
  // origin = bottom centre of the opening on the facade plane (z = 0); outside = +Z; covers opening + 10 cm frame overlap
  const g = propSet(1);
  const ow = opening === "door" ? 26 : 24, oh = opening === "door" ? 52 : 40;   // cells: door 1.3 x 2.6 m, window 1.2 x 2.0 m
  const hx = ow / 2;
  if (kind === "planks") {
    let y = 0, i = 0;
    const rng = mulberry32(opening === "door" ? 71 : 72);
    while (y + 3 <= oh) {
      const tilt = Math.round((rng() - 0.5) * 6), len = hx + 2 + Math.floor(rng() * 3);
      for (let x = -len; x < len; x++) { const yy = y + Math.round(tilt * x / len); for (let k = 0; k < 3; k++) if (yy + k >= 0) g.set(x + 0.5, yy + k + 0.5, 0.5, i % 2 ? "wood" : "woodLight"); }
      y += 3 + (opening === "door" ? 2 : 2) + Math.floor(rng() * 2); i++;

    // two vertical battens holding the planks
    B(g, -hx + 2, -hx + 3, 0, oh, 1, 1, "woodDark"); B(g, hx - 4, hx - 3, 0, oh, 1, 1, "woodDark");
    for (const xx of [-hx + 2, hx - 3]) for (let yy = 2; yy < oh; yy += 5) g.set(xx + 0.5, yy + 0.5, 2.5, "metal");
  } else if (kind === "plate") {
    B(g, -hx - 1, hx, 0, oh, 0, 1, (x, y) => (x + y * 3) % 11 === 0 ? "rust" : "steel");
    Bdel(g, -6, 5, Math.round(oh * 0.62), Math.round(oh * 0.62) + 2, 0, 1);              // firing slit
    for (const xx of [-hx, hx - 1]) for (const yy of [2, oh - 2, Math.round(oh / 2)]) g.set(xx + 0.5, yy + 0.5, 2.5, "steelDark");
    B(g, -hx - 1, hx, Math.round(oh * 0.62) - 1, Math.round(oh * 0.62) - 1, 2, 2, "steelDark");   // slit lip
  } else {
    // sandbags filling the opening up to chest height, planks above with a gap
    const rows = opening === "door" ? 4 : 3;

    const yy = rows * 6;
    B(g, -hx - 1, hx, yy + 4, yy + 6, 0, 0, "wood"); B(g, -hx - 1, hx, yy + 10, yy + 12, 0, 0, "woodLight");
    B(g, -hx + 1, -hx + 2, yy, oh, 1, 1, "woodDark"); B(g, hx - 3, hx - 2, yy, oh, 1, 1, "woodDark");
  }
  return { parts: [{ name: "body", set: g, unitM: PROP_M, pivot: [0, 0, 0] }], sockets: [{ name: "opening", pos: [0, 0, 0], dir: [0, 0, 1] }], anchor: "facade" };
}

function sandbagRing(g, rOut, courses, mat, seed) {
  // octagonal ring of sandbag runs (approximated with axis runs on 8 sides)
  const t = 6;
  for (let c = 0; c < courses; c++) {
    const y = c * 6, st = c % 2 === 1;
    const s = Math.round(rOut * 0.41);   // half side of the octagon
    sandbagRun(g, -s, s - 1, y, rOut - t, rOut - 1, mat, seed + c, st);
    sandbagRun(g, -s, s - 1, y, -rOut, -rOut + t - 1, mat, seed + c + 7, st);
    sandbagRunZ(g, -s, s - 1, y, rOut - t, rOut - 1, mat, seed + c + 3, st);
    sandbagRunZ(g, -s, s - 1, y, -rOut, -rOut + t - 1, mat, seed + c + 5, st);
    // diagonal corners: stepped bag blocks
    for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
      for (let k = 0; k < rOut - s - t + 2; k += 1) {
        const x = sx > 0 ? s + k : -s - k - 1, z0 = sz > 0 ? rOut - t - k : -rOut + k, z1 = z0 + t - 1;
        B(g, x, x, y, y + 4 + (k % 4 === 0 ? 0 : 1), Math.min(z0, z1), Math.max(z0, z1), pv(seed, k, c, sx * 3 + sz) < 0.3 ? "sandbagDark" : mat);
      }
    }
  }
}

/* =====================================================================================
   MESHER (shared by the Lab preview and the converter)
   Culled faces with Zombie Lab AO; a part's faces are also culled against its rigid group
   (a segment and its gear never move relative to each other). Greedy merge by (material, uniform AO).
   ===================================================================================== */
const DIRS = [
  { n: [1, 0, 0], u: [0, 1, 0], v: [0, 0, 1] }, { n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0] },
  { n: [0, 1, 0], u: [0, 0, 1], v: [1, 0, 0] }, { n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1] },
  { n: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] }, { n: [0, 0, -1], u: [0, 1, 0], v: [1, 0, 0] },
];
const CORN = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
function setLattice(set) { const c = set.map.values().next().value; if (!c) return [0, 0, 0]; const s = set.size; return [c.x, c.y, c.z].map(v => ((v % s) + s) % s); }
function occFn(sets) {   // point-in-solid test over sets sharing one coordinate space
  const L = sets.map(s => ({ s, off: setLattice(s) }));
  return (x, y, z) => {
    for (const { s, off } of L) {
      const k = s.size, cx = Math.floor((x - off[0]) / k + 0.5) * k + off[0], cy = Math.floor((y - off[1]) / k + 0.5) * k + off[1], cz = Math.floor((z - off[2]) / k + 0.5) * k + off[2];
      if (s.has(cx, cy, cz)) return true;
    }
    return false;
  };
}
function partFaces(set, group) {
  const occ = occFn([set].concat(group || []));
  const s = set.size, h = s / 2, q = s / 4, e = 0.01 * s;
  const faces = [];
  for (const c of set.map.values()) {
    for (let di = 0; di < 6; di++) {
      const d = DIRS[di];
      // hidden when the 4 quarter points just outside the face are solid
      let hidden = true;
      for (const [a, b] of CORN) {
        const p = [0, 1, 2].map(k => [c.x, c.y, c.z][k] + d.n[k] * (h + e) + d.u[k] * a * q + d.v[k] * b * q);
        if (!occ(p[0], p[1], p[2])) { hidden = false; break; }
      }
      if (hidden) continue;
      const nx = c.x + d.n[0] * s, ny = c.y + d.n[1] * s, nz = c.z + d.n[2] * s;
      const ao = [];
      for (const [su, sv] of CORN) {
        const s1 = occ(nx + su * d.u[0] * s, ny + su * d.u[1] * s, nz + su * d.u[2] * s) ? 1 : 0;
        const s2 = occ(nx + sv * d.v[0] * s, ny + sv * d.v[1] * s, nz + sv * d.v[2] * s) ? 1 : 0;
        const cr = occ(nx + (su * d.u[0] + sv * d.v[0]) * s, ny + (su * d.u[1] + sv * d.v[1]) * s, nz + (su * d.u[2] + sv * d.v[2]) * s) ? 1 : 0;
        ao.push(s1 && s2 ? 0 : 3 - (s1 + s2 + cr));
      }
      faces.push({ c, di, m: PAL[c.m], ao });
    }
  }
  return faces;
}
// quads: { corners: 4 x [x,y,z] in set units (CORN order, CCW from outside), di, ao[4], m, cells: [centres] }

  if (b) rows.push(["size (m)", [b.max.x - b.min.x, b.max.y - b.min.y, b.max.z - b.min.z].map(v => v.toFixed(2)).join(" × ")]);
  if (m.kind === "infantry") { rows.push(["weapon", m.weapon.kind]); rows.push(["support error", (m.poses.carry.supportError * 100).toFixed(1) + " cm"]); }
  if (m.sockets) rows.push(["sockets", m.sockets.map(s => s.name).join(", ") || "-"]);
  rows.push(["library build", buildMs.toFixed(0) + " ms"]);
  el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}
// ---- UI
const groupsUI = [["Infantry", LIB.infantry], ["Drops & supply", LIB.props.filter(p => p.cat === "drop" || p.cat === "supply")], ["Walls", LIB.props.filter(p => p.cat === "wall")],
  ["Fortification", LIB.props.filter(p => p.cat === "fort")], ["Barricades", LIB.props.filter(p => p.cat === "barricade")], ["Garrison", LIB.props.filter(p => p.cat === "garrison")], ["Hospital", LIB.props.filter(p => p.cat === "hospital")]];
const listEl = document.getElementById("assets");
listEl.innerHTML = groupsUI.map(([n, l]) => `<div class="grp"><b>${n}</b><div class="chips">${l.map(m => `<button class="chip" data-a="${m.name}" aria-pressed="${m.name === state.asset}">${m.label.replace(/^(Gabion|Reinforced) wall /, "$1 ")}</button>`).join("")}</div></div>`).join("");
listEl.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b) return; state.asset = b.dataset.a; state.mode = "single"; syncUI(); rebuild(); });
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const g = seg.dataset.group; state[g] = b.dataset.v;
  if (g === "light") setLight(b.dataset.v); else rebuild();
  syncUI();
}));
document.getElementById("zombie").addEventListener("change", e => { state.zombie = e.target.checked; rebuild(); });
document.getElementById("points").addEventListener("change", e => { state.points = e.target.checked; rebuild(); });
document.getElementById("open").addEventListener("change", e => { state.open = e.target.checked; rebuild(); });
function syncUI() {
  document.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(state[seg.dataset.group] === b.dataset.v))));
  listEl.querySelectorAll("[data-a]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.a === state.asset)));
}
// ---- JSON export: every model's parts as voxel lists (palette indices), plus rig data
function exportJSON() {
  const enc = p => ({ name: p.name, parent: p.parent || null, slot: p.slot || null, unit: +(p.set.size * p.unitM).toFixed(6), pivot: p.pivot, weaponSpace: !!p.weaponSpace,
                      cellSize: p.set.size, voxels: [...p.set.map.values()].map(c => [c.x, c.y, c.z, PAL[c.m]]) });
  return { format: "military_lab_v1", palette: PALETTE.filter(p => !p.name.startsWith("z_")), infantry: LIB.infantry.map(m => ({ name: m.name, label: m.label, cls: m.cls, unitM: m.unitM, weapon: m.weapon, poses: m.poses, sockets: m.sockets, parts: m.parts.map(enc) })),
           props: LIB.props.map(m => ({ name: m.name, label: m.label, cat: m.cat, sockets: m.sockets, parts: m.parts.map(enc) })) };
}
document.getElementById("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(exportJSON())], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "military_models_v1.json"; a.click();
});
// ---- loop
function resize() { const w = stageEl.clientWidth, h = stageEl.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener("resize", resize);
const v3 = new THREE.Vector3();
function loop() {
  controls.update();
  const c = controls.target; key.position.set(c.x + 6, c.y + 10, c.z + 5); key.target.position.copy(c); fill.position.set(c.x - 6, c.y + 3, c.z - 5); lamp.position.set(c.x + 1.5, c.y + 2.5, c.z + 1.5);
  const span = Math.max(4, camera.position.distanceTo(c) * 0.7); const sc = key.shadow.camera; sc.left = sc.bottom = -span; sc.right = sc.top = span; sc.near = 0.1; sc.far = 80; sc.updateProjectionMatrix();
  renderer.render(scene, camera);
  // labels
  if (state.mode === "lineup" || state.mode === "props") {
    if (labelsEl.childElementCount !== shown.filter(s => s.label).length) labelsEl.innerHTML = shown.filter(s => s.label).map(() => '<div class="tag"></div>').join("");
    let i = 0;
    for (const o of shown) if (o.label) {
      const b = new THREE.Box3().setFromObject(o.root); v3.set((b.min.x + b.max.x) / 2, b.min.y, b.max.z + 0.1).project(camera);
      const el = labelsEl.children[i++]; el.textContent = o.label; el.style.left = ((v3.x + 1) / 2 * stageEl.clientWidth) + "px"; el.style.top = ((1 - v3.y) / 2 * stageEl.clientHeight + 6) + "px";
    }
  }
  requestAnimationFrame(loop);
}
resize(); setLight("neutral"); rebuild(); loop();
window.__mil = { state, rebuild, setLight, syncUI, exportJSON, LIB, ALL, camera, controls, scene, renderer, frame, bounds, shown: () => shown, ready: true,
  set(o) { Object.assign(state, o); if (o.light) setLight(o.light); syncUI(); rebuild(); } };
})();
</script>
</body></html>
