<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Military Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Same studio look as Zombie Lab v3: full-bleed stage, floating control column. */
:root {
  --bg: #14170f; --panel: rgba(18, 21, 14, 0.88); --raised: #1f2518; --line: #313a27; --fg: #e7ead9; --muted: #98a184;
  --accent: #c9b46a; --accent-ink: #1d1a0c;
  --ui: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark; box-sizing: border-box;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px var(--ui); overflow: hidden; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
.panel { position: absolute; top: 16px; left: 16px; width: 316px; max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 13px; padding: 16px; scrollbar-width: thin; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: 0.02em; }
.brand h1 b { color: var(--accent); }
.brand span { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.sec { display: flex; flex-direction: column; gap: 7px; }
.label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.label em { font-style: normal; font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--fg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button, .btn { font: 500 12px/1 var(--ui); color: var(--fg); background: transparent; border: 0; border-radius: 5px; padding: 8px 4px; cursor: pointer; white-space: nowrap; }
.seg button:hover { background: #2a3221; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn { background: var(--raised); border: 1px solid var(--line); padding: 8px 10px; }
.btn:hover { border-color: #4a5638; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.list { display: flex; flex-direction: column; gap: 8px; }
.grp b { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font: 500 11px/1 var(--ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 99px; padding: 5px 8px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 11px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); text-align: right; }
.hint { position: absolute; right: 16px; bottom: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; pointer-events: none; }
#labels .tag { position: absolute; transform: translate(-50%, 0); pointer-events: none; font: 600 11px var(--ui); color: var(--fg); white-space: nowrap; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
@media (max-width: 720px) { .panel { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 48%; } .hint { display: none; } }
</style></head><body>
<div id="stage" aria-label="3D preview: drag to rotate, scroll to zoom"></div>
<div id="labels"></div>
<aside class="panel" aria-label="Military asset controls">
  <div class="brand"><h1>Tiny Tiny <b>Military</b> Lab</h1><span>v1 · models + anims</span></div>
  <div class="sec"><div class="label">Mode</div>
    <div class="seg" data-group="mode"><button data-v="single" aria-pressed="true">Asset</button><button data-v="lineup" aria-pressed="false">Lineup</button><button data-v="props" aria-pressed="false">Props</button><button data-v="rts" aria-pressed="false">RTS</button><button data-v="speclineup" aria-pressed="false">7b</button><button data-v="anim" aria-pressed="false">Anim</button></div></div>
  <div class="sec" id="animSec" hidden><div class="label">Animation <em id="animClip"></em></div>
    <div class="seg" id="animScene"><button data-s="classes" aria-pressed="true">Classes</button><button data-s="para" aria-pressed="false">Parachute</button><button data-s="crate" aria-pressed="false">Crate</button><button data-s="rts" aria-pressed="false">RTS crowd</button><button data-s="specrts" aria-pressed="false">RTS 7b</button></div>
    <div class="seg" id="animCls"><button data-c="all" aria-pressed="true">All 3</button><button data-c="rifleman" aria-pressed="false">Rifle</button><button data-c="mg" aria-pressed="false">MG</button><button data-c="sniper" aria-pressed="false">Sniper</button><button data-c="new" aria-pressed="false">Eng+Flame</button><button data-c="engineer" aria-pressed="false">Eng</button><button data-c="flamer" aria-pressed="false">Flame</button></div>
    <div class="chips" id="animActions"></div>
    <div class="row"><button class="btn" id="animPlay">Pause</button><button class="btn" id="animRestart">Restart</button>
      <select class="btn" id="animSpeed"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
    <input type="range" id="animScrub" min="0" max="1000" value="0" aria-label="Scrub">
    <label class="check"><input type="checkbox" id="animLoop" checked> Loop</label>
    <label class="check"><input type="checkbox" id="animTravel" checked> Travel at clip speed (stride markers on the grid)</label>
    <label class="check"><input type="checkbox" id="animFx" checked> Weapon FX</label>
    <dl class="kv" id="animInfo"></dl></div>
  <div class="sec"><div class="label">Camera</div>
    <div class="seg" data-group="view"><button data-v="persp" aria-pressed="true">3/4</button><button data-v="front" aria-pressed="false">Front</button><button data-v="side" aria-pressed="false">Side</button><button data-v="rear" aria-pressed="false">Rear</button><button data-v="top" aria-pressed="false">Top</button></div></div>
  <div class="sec"><div class="label">Pose (infantry)</div>
    <div class="seg" data-group="pose"><button data-v="carry" aria-pressed="true">Carry</button><button data-v="rest" aria-pressed="false">Rest (template)</button></div></div>
  <div class="sec"><div class="label">Lighting</div>
    <div class="seg" data-group="light"><button data-v="neutral" aria-pressed="true">Neutral</button><button data-v="night" aria-pressed="false">Night</button></div></div>
  <div class="sec">
    <label class="check"><input type="checkbox" id="zombie" checked> Zombie beside it (scale)</label>
    <label class="check"><input type="checkbox" id="points"> Joints, grip / support points, sockets</label>
    <label class="check"><input type="checkbox" id="open"> Doors / gates open</label>
  </div>
  <div class="sec"><div class="label">Asset <em id="cur"></em></div><div class="list" id="assets"></div></div>
  <div class="sec"><div class="label">Info</div><dl class="kv" id="info"></dl></div>
  <div class="row"><button class="btn" id="export">Export JSON (all models)</button></div>
</aside>
<div class="hint">drag rotate · scroll zoom · right-drag pan</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
"use strict";
if (!window.THREE) { document.getElementById("stage").innerHTML = '<p style="padding:40px;color:#98a184">The 3D library could not be loaded.</p>'; return; }
/* === MILITARY LIBRARY BEGIN === */
/* Renderer-free model library (also evaluated by tools/convert_military.mjs in a Node vm sandbox).
   Conventions: Y up, front = +Z, model's left = +X. Infantry authored in body-voxel units (V = 1.7/18 m),
   body segments with 1 V cells (Zombie Lab layout), gear and weapons with 0.5 V cells. Props in 5 cm cells. */
const MIL_VERSION = 1;
const V_M = 1.7 / 18, FINE_M = V_M / 2, PROP_M = 0.05;

/* ---------------- deterministic randomness (same functions as Zombie Lab) ---------------- */
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hash3(x, y, z, s) { let h = Math.imul(Math.round(x * 2) + 1000, 73856093) ^ Math.imul(Math.round(y * 2) + 1000, 19349663) ^ Math.imul(Math.round(z * 2) + 1000, 83492791) ^ s; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

/* ---------------- palette (sRGB). flags: 1 emissive, 2 metal, 4 glass ---------------- */
const PALETTE = [];
const PAL = {};
function pal(name, rgb, noise, flags) { PAL[name] = PALETTE.length; PALETTE.push({ name, rgb, noise: noise === undefined ? 0.06 : noise, flags: flags || 0 }); }
// uniforms / gear
pal("olive", "#5b5f3a"); pal("oliveDark", "#3f4229"); pal("oliveLight", "#767a4d");
pal("coyote", "#8a7352"); pal("coyoteDark", "#675539"); pal("coyoteLight", "#a48b66");
pal("rangerGreen", "#4c5440"); pal("rangerDark", "#363c2e");
pal("mcTan", "#a08c68"); pal("mcGreen", "#6b6f4a"); pal("mcBrown", "#6e5a40"); pal("mcLight", "#bba886");
pal("webbing", "#55513a"); pal("tan", "#b59f78"); pal("khaki", "#9c8a62");
pal("black", "#1f2021", 0.05); pal("blackSoft", "#2d2e2c", 0.05); pal("bootBrown", "#5a4630");
pal("gunBlack", "#1a1b1d", 0.04, 2); pal("gunMetal", "#3b3d40", 0.04, 2); pal("metal", "#7d8186", 0.04, 2);
pal("brass", "#b8913a", 0.05, 2); pal("lens", "#2c4a5e", 0.02, 4); pal("lensGlint", "#6fa0bd", 0.02, 4);
pal("suppressor", "#4a4b47", 0.04, 2); pal("fde", "#a58f6b"); pal("eyeDark", "#17140f", 0.0); pal("lip", "#6e4a3a", 0.03);
pal("scarfTan", "#b8a887"); pal("scarfOlive", "#6d6b4c"); pal("scarfBlack", "#2b2b2b");
pal("ghillieA", "#6f6a45"); pal("ghillieB", "#8c7c55"); pal("ghillieC", "#4d5233");
pal("stencil", "#d9cf9e", 0.02); pal("stencilYellow", "#c9a930", 0.02);
// skin tones (realistic, NOT the zombie greens)
const SKIN_TONES = ["#e0b294", "#c99a76", "#a5764f", "#7f5538", "#5e3d29", "#d6a47c"];
SKIN_TONES.forEach((c, i) => { pal("skin" + i, c, 0.04); });
const SKIN_DARK = SKIN_TONES.map(c => { const n = parseInt(c.slice(1), 16); const f = v => Math.round(v * 0.78).toString(16).padStart(2, "0"); return "#" + f((n >> 16) & 255) + f((n >> 8) & 255) + f(n & 255); });
SKIN_DARK.forEach((c, i) => pal("skinDark" + i, c, 0.04));
const HAIR = ["#2b241e", "#5a4630", "#1e1e22", "#8c7a5c"];
HAIR.forEach((c, i) => pal("hair" + i, c, 0.04));
// props
pal("sand", "#b9a57a", 0.08); pal("sandDark", "#9c8961", 0.08); pal("hescoWire", "#6e6c62", 0.05, 2); pal("hescoFabric", "#c2b48c", 0.06);
pal("sandbag", "#a99a70", 0.09); pal("sandbagDark", "#8a7c56", 0.09); pal("sandbagOlive", "#7b7650", 0.09);
pal("wood", "#8a6a44", 0.08); pal("woodDark", "#6a4f31", 0.08); pal("woodLight", "#a88a5e", 0.08); pal("rope", "#b9a77f", 0.05);
pal("steel", "#5d6166", 0.05, 2); pal("steelDark", "#43474b", 0.05, 2); pal("rust", "#6e4a33", 0.08);
pal("containerOlive", "#55593a", 0.04, 2); pal("containerDark", "#3d402b", 0.04, 2);
pal("canopyOlive", "#6a6d48", 0.04); pal("canopyDark", "#53563a", 0.04); pal("canopyTan", "#a6956d", 0.04); pal("canopyWhite", "#d2d0c2", 0.04);
pal("line", "#cfc8ae", 0.02); pal("strap", "#4b4a36", 0.04);
pal("canvas", "#857a58", 0.06); pal("canvasLight", "#a79b77", 0.06);
pal("white", "#e6e4da", 0.03); pal("medGreen", "#2f8a4a", 0.03); pal("flagOlive", "#5d6440", 0.03); pal("flagWhite", "#e2e0d6", 0.03);
pal("pole", "#6a6c6e", 0.03, 2); pal("concrete", "#9a978d", 0.06); pal("radioGreen", "#3f4630", 0.04);
pal("cotGreen", "#5f6646", 0.05); pal("mattress", "#7a7d62", 0.05); pal("blanket", "#6b5a40", 0.05);

/* ---------------- voxel set: cells of edge `size` with arbitrary centres on one lattice ---------------- */
const vkey = (x, y, z) => Math.round(x * 4) + "," + Math.round(y * 4) + "," + Math.round(z * 4);
function makeSet(size) {
  const map = new Map();
  return {
    size, map,
    set(x, y, z, m) { if (m === undefined || m === null) throw new Error("no material"); map.set(vkey(x, y, z), { x, y, z, m }); },
    del(x, y, z) { map.delete(vkey(x, y, z)); },
    has(x, y, z) { return map.has(vkey(x, y, z)); },
    get(x, y, z) { return map.get(vkey(x, y, z)); },
    // fill the region between EDGES [x0,x1]x[y0,y1]x[z0,z1] (set units) with cells of this set's size
    ebox(x0, x1, y0, y1, z0, z1, m) {
      const s = size, h = s / 2;
      for (let x = x0 + h; x < x1 - 1e-6; x += s) for (let y = y0 + h; y < y1 - 1e-6; y += s) for (let z = z0 + h; z < z1 - 1e-6; z += s) this.set(x, y, z, m);
    },
    // inclusive cell-centre box (Zombie Lab style, unit cells)
    box(x0, x1, y0, y1, z0, z1, m) { for (let x = x0; x <= x1 + 1e-6; x += size) for (let y = y0; y <= y1 + 1e-6; y += size) for (let z = z0; z <= z1 + 1e-6; z += size) this.set(x, y, z, m); },
    paint(fn) { for (const c of map.values()) { const r = fn(c); if (r) c.m = r; } },
  };
}

/* =====================================================================================
   INFANTRY — body template identical to Zombie Lab v3 (18 V tall, 10 segments)
   ===================================================================================== */
const SLOTS = ["head", "torso", "upperArmL", "forearmL", "upperArmR", "forearmR", "thighL", "shinL", "thighR", "shinR"];
const SIDE = { head: 0, torso: 0, upperArmL: 1, forearmL: 1, upperArmR: -1, forearmR: -1, thighL: 1, shinL: 1, thighR: -1, shinR: -1 };
const PIVOT = { head: [0, 14, 0], torso: [0, 8, 0], upperArmL: [3, 13.5, 0], forearmL: [3, 10, 0], upperArmR: [-3, 13.5, 0], forearmR: [-3, 10, 0],
                thighL: [1.5, 8, 0], shinL: [1.5, 4, 0], thighR: [-1.5, 8, 0], shinR: [-1.5, 4, 0] };
const PARENT = { head: "torso", torso: null, upperArmL: "torso", forearmL: "upperArmL", upperArmR: "torso", forearmR: "upperArmR",
                 thighL: null, shinL: "thighL", thighR: null, shinR: "thighR" };
const FK_ORDER = ["torso", "head", "upperArmL", "forearmL", "upperArmR", "forearmR", "thighL", "shinL", "thighR", "shinR"];
const HAND = { L: [3, 6.5, 0], R: [-3, 6.5, 0] };

// Zombie Lab helpers, verbatim layout
function armCol(v, s, yTop, tags) { tags.forEach((t, i) => { if (t) v.set(3 * s, yTop - i, 0, t); }); }
function legRow(v, s, y, tag) { for (const x of [s, 2 * s]) for (const z of [-0.5, 0.5]) v.set(x, y, z, typeof tag === "function" ? tag(x, y, z) : tag); }
function legRows(v, s, yTop, tags) { tags.forEach((t, i) => { if (t) legRow(v, s, yTop - i, t); }); }
function shoe(v, s, tag) { legRow(v, s, 0.5, tag); v.set(s, 0.5, 1.5, tag); v.set(2 * s, 0.5, 1.5, tag); }

// camouflage: blocky multicam-ish pattern from a hash of the (coarse) position
const CAMO = {
  mc: ["mcTan", "mcGreen", "mcBrown", "mcTan", "mcLight", "mcTan"],
  rg: ["rangerGreen", "rangerGreen", "rangerDark", "rangerGreen"],
  olive: ["olive", "olive", "oliveDark", "olive"],
  coyote: ["coyote", "coyote", "coyoteDark", "coyote"],
  tan: ["tan", "tan", "khaki"],
  net: ["olive", "oliveDark", "olive", "webbing", "olive"],
};
function camoAt(scheme, seed, x, y, z, block) {
  const b = block || 1;
  const list = CAMO[scheme] || [scheme];
  return list[Math.floor(hash3(Math.floor(x / b + 64), Math.floor(y / b + 64), Math.floor(z / b + 64), seed) * list.length)];
}

/* ---- body modules (1 V cells). L = look ---- */
function buildBody(slot, L) {
  const v = makeSet(1), s = SIDE[slot];
  const cam = (x, y, z) => camoAt(L.uniform, L.seed, x, y, z);
  const skin = "skin" + L.skin, skinD = "skinDark" + L.skin;
  switch (slot) {
    case "head":
      v.set(0, 14.5, 0, skin);
      v.box(-1, 1, 15.5, 17.5, -1, 1, skin);
      v.box(-1, 1, 17.5, 17.5, -1, 1, "hair" + L.hair);
      v.box(-1, 1, 16.5, 16.5, -1, -1, "hair" + L.hair);
      v.set(-1, 16.5, 1, "eyeDark"); v.set(1, 16.5, 1, "eyeDark");
      v.set(0, 15.5, 1, L.beard ? "hair" + L.hair : "lip");
      if (L.beard) { v.set(-1, 15.5, 1, "hair" + L.hair); v.set(1, 15.5, 1, "hair" + L.hair); }
      break;
    case "torso":
      v.box(-2, 2, 8.5, 13.5, -1, 1, "x"); v.paint(c => cam(c.x, c.y, c.z));
      v.box(-2, 2, 8.5, 8.5, -1, 1, "webbing");          // trouser belt line
      v.set(0, 13.5, 1, skin);                            // collar opening
      break;
    case "upperArmL": case "upperArmR":
      armCol(v, s, 13.5, [1, 1, 1, 1].map((_, i) => L.rolled && i === 3 ? (L.uniform === "mc" ? "mcLight" : "tan") : cam(3 * s, 13.5 - i, 0)));
      break;
    case "forearmL": case "forearmR": {
      const glove = L.gloves ? L.gloves : skin;
      if (L.rolled) armCol(v, s, 9.5, [skin, skin, skinD, glove]);
      else armCol(v, s, 9.5, [cam(3 * s, 9.5, 0), cam(3 * s, 8.5, 0), cam(3 * s, 7.5, 1), glove]);
      break;
    }
    case "thighL": case "thighR":
      legRows(v, s, 7.5, [cam, cam, cam, cam]);
      break;
    case "shinL": case "shinR":
      legRows(v, s, 3.5, [cam, cam, L.boot]);
      shoe(v, s, L.boot);
      break;
  }
  return v;
}

/* ---- gear (0.5 V cells, authored by EDGES in body space) ---- */
function ring(g, y0, y1, out, inn, m, opts) {   // square ring between |x|,|z| <= out and > inn (edges), corners optional
  const cut = opts && opts.round;
  for (let x = -out + 0.25; x < out; x += 0.5) for (let z = -out + 0.25; z < out; z += 0.5) {
    if (Math.abs(x) < inn && Math.abs(z) < inn) continue;
    if (cut && Math.abs(x) > out - 0.5 && Math.abs(z) > out - 0.5) continue;
    if (opts && opts.skip && opts.skip(x, z)) continue;
    for (let y = y0 + 0.25; y < y1; y += 0.5) g.set(x, y, z, typeof m === "function" ? m(x, y, z) : m);
  }
}
function buildHeadGear(L) {
  const g = makeSet(0.5);
  const cov = (x, y, z) => camoAt(L.helmetCover, L.seed + 7, x, y, z, 0.5);
  if (L.hat === "boonie") {
    ring(g, 17, 17.5, 2.5, 1.5, cov, {});                                    // brim
    ring(g, 17.5, 18, 2, 1.5, cov, {});                                      // band
    g.ebox(-1.5, 1.5, 18, 18.5, -1.5, 1.5, "x"); g.paint(c => c.m === "x" ? cov(c.x, c.y, c.z) : null);   // crown
    ring(g, 18, 18.5, 2, 1.5, cov, { round: true });
    g.ebox(-1, 1, 18.5, 19, -1, 1, "x"); g.paint(c => c.m === "x" ? cov(c.x, c.y, c.z) : null);
    for (let x = -1.75; x < 2; x += 0.5) { g.set(x, 17.75, 1.75, "webbing"); }   // band strip front
  } else {
    // helmet shell: forehead above the eyes, ears and nape covered, rounded corners
    ring(g, 17, 18, 2, 1.5, cov, { round: true });
    ring(g, 16, 17, 2, 1.5, cov, { round: true, skip: (x, z) => z > 1.5 });      // sides and back down to the ears
    g.ebox(-1.5, 1.5, 18, 18.5, -1.5, 1.5, "x"); g.paint(c => c.m === "x" ? cov(c.x, c.y, c.z) : null);

function barricade(kind, opening) {

  if (kind === "planks") {
    let y = 0, i = 0;
    const rng = mulberry32(opening === "door" ? 71 : 72);
    while (y + 3 <= oh) {
      const tilt = Math.round((rng() - 0.5) * 6), len = hx + 2 + Math.floor(rng() * 3);
      for (let x = -len; x < len; x++) { const yy = y + Math.round(tilt * x / len); for (let k = 0; k < 3; k++) if (yy + k >= 0) g.set(x + 0.5, yy + k + 0.5, 0.5, i % 2 ? "wood" : "woodLight"); }

function sandbagRing(g, rOut, courses, mat, seed) {
  // octagonal ring of sandbag runs (approximated with axis runs on 8 sides)
  const t = 6;
  for (let c = 0; c < courses; c++) {
    const y = c * 6, st = c % 2 === 1;
    const s = Math.round(rOut * 0.41);   // half side of the octagon
    sandbagRun(g, -s, s - 1, y, rOut - t, rOut - 1, mat, seed + c, st);
    sandbagRun(g, -s, s - 1, y, -rOut, -rOut + t - 1, mat, seed + c + 7, st);
    sandbagRunZ(g, -s, s - 1, y, rOut - t, rOut - 1, mat, seed + c + 3, st);
    sandbagRunZ(g, -s, s - 1, y, -rOut, -rOut + t - 1, mat, seed + c + 5, st);
    // diagonal corners: stepped bag blocks
    for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
      for (let k = 0; k < rOut - s - t + 2; k += 1) {
        const x = sx > 0 ? s + k : -s - k - 1, z0 = sz > 0 ? rOut - t - k : -rOut + k, z1 = z0 + t - 1;
        B(g, x, x, y, y + 4 + (k % 4 === 0 ? 0 : 1), Math.min(z0, z1), Math.max(z0, z1), pv(seed, k, c, sx * 3 + sz) < 0.3 ? "sandbagDark" : mat);
      }
    }
  }
}

/* =====================================================================================

   Culled faces with Zombie Lab AO; a part's faces are also culled against its rigid group
   (a segment and its gear never move relative to each other). Greedy merge by (material, uniform AO).
   ===================================================================================== */
const DIRS = [
  { n: [1, 0, 0], u: [0, 1, 0], v: [0, 0, 1] }, { n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0] },
  { n: [0, 1, 0], u: [0, 0, 1], v: [1, 0, 0] }, { n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1] },
  { n: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] }, { n: [0, 0, -1], u: [0, 1, 0], v: [1, 0, 0] },

function setLattice(set) { const c = set.map.values().next().value; if (!c) return [0, 0, 0]; const s = set.size; return [c.x, c.y, c.z].map(v => ((v % s) + s) % s); }

  const L = sets.map(s => ({ s, off: setLattice(s) }));
  return (x, y, z) => {
    for (const { s, off } of L) {
      const k = s.size, cx = Math.floor((x - off[0]) / k + 0.5) * k + off[0], cy = Math.floor((y - off[1]) / k + 0.5) * k + off[1], cz = Math.floor((z - off[2]) / k + 0.5) * k + off[2];

  // ---- turn in place (root yaw +-90 deg, two steps)

        const kick = [0.5 + 0.55 * k, 0.06 + 0.12 * k * (0.6 + 0.4 * hnoise(i, 1)), 0.06 * hnoise(i, 2) * k, 0.18 * k];

  } else if (isFl) {         // flamethrower: sustained stream (FX emitter while the clip plays), slow sweep

  } else {                   // one heavy suppressed shot + bolt cycle (left hand works the bolt)

    add(cls, "fire", { duration: dur, loop: true, rate: 1 / dur,
      events: [{ t: 0, type: "suppressed", fx }, { t: 0, type: "muzzle_flash", fx }, { t: 0, type: "recoil", kick: 0.5 }, { t: 0.78, type: "bolt" }, { t: 0.9, type: "shell_eject", fx }, { t: 1.12, type: "bolt" }],

        S.st = st; const bc = smooth((t - 0.5) / 0.25) * (1 - smooth((t - 1.2) / 0.3)); S.wpn = kickPlacement(S.wpn, [0.3 * bc, -0.12 * bc, 0.08 * bc, -0.3 * bc]); return S; } });
  }

    const pouchT = { rifleman: [1.0, 2.4, 3.3], mg: [2.9, 1.2, -1.8], sniper: [1.0, 3.2, 3.1], engineer: [1.0, 2.4, 3.3], flamer: [1.0, 2.4, 3.3] }[cls];

              [1.45, "w", rig.magwell, item, 1], [1.55, "w", rig.magwell, 0, 1], [1.8, "w", rig.charge, 0, 1], [1.9, "w", vadd(rig.charge, [0, 0, -1.2]), 0, 1], [2.15, "w", rig.support, 0, 0.6], [2.4, "w", rig.support, 0, 0]];

      const S = Object.assign({ torso, head: [A.head[0] + 0.3 * low, A.head[1] * (1 - 0.5 * low), 0], pelvis: A.pelvis, wpn, item: u < 0.5 ? a[3] : b[3] }, aimLegs);

      else if (a[1] === "b" && b[1] === "b") { S.sw = 0; S.leftT = vlerp(a[2], b[2], u); }
      else { const wt = a[1] === "w" ? 1 - u : u; S.sw = wt; S.st = a[1] === "w" ? a[2] : b[2]; S.leftT = a[1] === "b" ? a[2] : b[2]; }

    } });
  }

  // ---- hit reaction (from idle stance, back to idle)
  add(cls, "hit", { duration: 0.6, loop: false, events: [{ t: 0.06, type: "hit" }], gen: t => {
    const k = t < 0.07 ? smooth(t / 0.07) : Math.exp(-(t - 0.07) * 6) * (1 - smooth((t - 0.45) / 0.15));
    const torso = [carryTorso[0] - 0.45 * k, carryTorso[1] + 0.35 * k, -0.15 * k];

      wpn: kickPlacement(carryT, [0.4 * k, -0.35 * k, 0.3 * k, 0.4 * k]), sw: 1 - 0.85 * k, leftRot: { upper: [-0.4, 0, 0.9], fore: [-0.4, 0, 0] } }, standLegs());
  } });

  // ---- deaths
  // A: shot in the chest, knees buckle, falls backwards onto the back, arms flung
  add(cls, "death_a", { duration: 1.2, loop: false, rootMotion: true, weaponDrop: 0.3, events: [{ t: 0.6, type: "body_fall" }], gen: t => {
    const k1 = smooth(t / 0.25), k2 = smooth((t - 0.15) / 0.45), k3 = smooth((t - 0.6) / 0.2);
    const torso = [carryTorso[0] - 0.5 * k1 + 0.4 * k2 - 0.2 * k3, carryTorso[1] * (1 - k2), 0.1 * k1];
    return { torso, head: [-0.5 * k1 + 0.3 * k3, 0.3 * k2, 0.2 * k2], pelvis: [0, -1.5 * k1, -2.6 * k2], rootRot: [-1.5 * k2 - 0.07 * k3, 0.2 * k2, 0.1 * k2],
      legs: { L: { thigh: [-0.3 * k1 - 0.5 * k2 + 0.4 * k3, 0, 0.15 * k2], shin: [0.9 * k1 - 0.3 * k2, 0, 0] }, R: { thigh: [-0.1 * k1 - 0.2 * k2, 0, -0.25 * k2], shin: [0.7 * k1 + 0.2 * k2, 0, 0] } },
      wpn: kickPlacement(carryT, [0.8 * k1, -0.9 * k2, 0.8 * k2, 1.0 * k1]), sw: t >= 0.3 ? 0 : 1 - k1, leftRot: { upper: [-1.3 * k2, 0, 0.3 + 1.0 * k2], fore: [-0.2, 0, 0] },
      poleR: [-1, 0.5, -0.4], ground: k3, dropped: t >= 0.3 - 1e-6 };
  } });
  // B: crumples forward: knees, then face down, weapon falls in front
  add(cls, "death_b", { duration: 1.4, loop: false, rootMotion: true, weaponDrop: 0.4, events: [{ t: 0.4, type: "body_fall" }, { t: 0.8, type: "body_fall" }], gen: t => {
    const k1 = smooth(t / 0.4), k2 = smooth((t - 0.4) / 0.4), k3 = smooth((t - 0.8) / 0.25);
    const torso = [carryTorso[0] + 0.5 * k1 - 0.3 * k2, carryTorso[1] * (1 - k1) - 0.2 * k2, 0.15 * k2];
    return { torso, head: [0.4 * k1 - 0.6 * k2, -0.3 * k2, 0.1], pelvis: [0, -3.7 * k1 + 1.5 * k2, 1.6 * k2], rootRot: [1.35 * k2 + 0.1 * k3, -0.25 * k2, 0.1 * k2],
      legs: { L: { thigh: [-0.15 * k1 + 0.3 * k2, 0, 0.1 * k2], shin: [1.6 * k1 - 1.3 * k2, 0, 0] }, R: { thigh: [0.1 * k1 + 0.2 * k2, 0, -0.15 * k2], shin: [1.5 * k1 - 1.1 * k2, 0, 0] } },
      wpn: kickPlacement(carryT, [0, 0.9 * k1 - 0.6 * k2, -0.3 * k2, -1.0 * k1]), sw: t >= 0.4 ? 0 : 1 - smooth((t - 0.22) / 0.18), leftRot: { upper: [-0.6 - 1.5 * k2, 0, 0.3], fore: [-0.5 * (1 - k2), 0, 0] },
      ground: 0.5 * k1 + 0.5 * k3, dropped: t >= 0.4 - 1e-6 };
  } });
  // C: spun by a hit to the shoulder, falls on the side
  add(cls, "death_c", { duration: 1.2, loop: false, rootMotion: true, weaponDrop: 0.3, events: [{ t: 0.65, type: "body_fall" }], gen: t => {
    const k1 = smooth(t / 0.35), k2 = smooth((t - 0.2) / 0.45), k3 = smooth((t - 0.65) / 0.25);
    const torso = [carryTorso[0] + 0.25 * k1, carryTorso[1] + 0.9 * k1, -0.3 * k2];
    return { torso, head: [0.2, 0.4 * k1, -0.4 * k2], pelvis: [1.5 * k2, -2.2 * k1, 0], rootRot: [0, 1.4 * k1, 1.45 * k2 + 0.08 * k3],
      legs: { L: { thigh: [-0.6 * k2, 0, 0.2 * k2], shin: [1.0 * k1 - 0.2 * k2, 0, 0] }, R: { thigh: [0.3 * k1, 0, -0.1], shin: [0.9 * k1, 0, 0] } },
      wpn: kickPlacement(carryT, [0.5 * k1, 0.5 * k1 - 1.0 * k2, 0.6 * k2, 0]), sw: t >= 0.3 ? 0 : 1 - k1, leftRot: { upper: [-0.3, 0, 0.3 + 1.2 * k1], fore: [-0.6, 0, 0] }, ground: k3, dropped: t >= 0.3 - 1e-6 };
  } });

  // ---- collect ammunition: kneel at a crate (in front, 0.75 m), grab with the left hand, stow on the vest, stand
  {
    const dur = 3.2, crate = [0.8, 4.6, 8.0];      // grab point, clip space V (on top of the crate, slightly left)
    const pouch = { rifleman: [1.2, 2.6, 3.3], mg: [1.6, 2.8, 3.8], sniper: [1.2, 3.2, 3.1], engineer: [1.2, 2.6, 3.3], flamer: [1.6, 2.6, 3.4] }[cls];
    const item = { rifleman: HAND_ITEM.rifleMag, mg: HAND_ITEM.ammoCan, sniper: HAND_ITEM.sniperMag, engineer: HAND_ITEM.rifleMag, flamer: HAND_ITEM.ammoCan }[cls];
    add(cls, "collect_ammo", { duration: dur, loop: false, events: [{ t: 1.25, type: "grab" }, { t: 2.05, type: "stow" }], gen: t => {
      const down = smooth(t / 0.7) * (1 - smooth((t - 2.35) / 0.7));
      const reach = smooth((t - 0.6) / 0.55) * (1 - smooth((t - 1.3) / 0.55));
      const toPouch = smooth((t - 1.35) / 0.55) * (1 - smooth((t - 2.15) / 0.4));
      const torso = [carryTorso[0] + 0.55 * down + 0.35 * reach, carryTorso[1] * (1 - down), 0.05 * reach];
      const pel = [0, lerp(-0.2, kneel.pelvis[1], down), lerp(0, -0.3, down)];
      const s1 = clamp01(t / 0.45), s2 = clamp01((t - 2.45) / 0.5), sL = s1 * (1 - s2);
      const liftL = 1.2 * (Math.sin(Math.PI * s1) + Math.sin(Math.PI * s2));
      const legs = { L: { foot: [lerp(1.5, 1.7, sL), liftL, lerp(0.35, 3.6, smooth(sL))] }, R: { foot: vadd(vlerp(stanceR, KNEEL_R, down), [0, 0.8 * Math.sin(Math.PI * down), 0]) } };
      const plantL = s1 <= 0 || (s1 >= 1 && s2 <= 0) || s2 >= 1, plantR = down <= 0.001 || down >= 0.999;
      // weapon: right hand keeps it, muzzle up, resting across the right thigh
      const rest = blendPlacement(carryT, { gripT: [-2.0, 1.5, 3.2], W: wMat([0.2, -1.1, -0.2]) }, down);
      // left hand world target -> torso space
      const tR = eulerMat(torso);
      const crateT = mvec(mT(tR), vsub(vsub(crate, pel), PIVOT.torso));
      let leftT = vlerp(vlerp([1.6, 0.5, 2.6], crateT, reach), pouch, toPouch);
      const sw = 1 - smooth(t / 0.4) * (1 - smooth((t - 2.6) / 0.4));
      return { torso, head: [carryHead[0] + 0.5 * down, carryHead[1] * (1 - down), 0], pelvis: pel, legs, footL: plantL, footR: plantR, wpn: rest, sw, leftT,
        item: t > 1.25 && t < 2.05 ? item : 0, ground: 0 };
    } });
  }

  // ---- root-motion walks: enter / exit building, stairs
  const walkRM = (action, dur, steps, stepLen, upper, rise, events, opts) => {
    opts = opts || {};
    add(cls, action, Object.assign({ duration: dur, loop: !!opts.loop, rootMotion: true, events, gen: t => {
      // feet: alternate steps (L first); each step moves one foot forward by 2*stepLen (first step: stepLen)
      const sd = dur / steps;
      const footPos = (side, tt) => {
        const first = side === "L" ? 0 : 1, x = side === "L" ? 1.5 : -1.5;
        let z = side === "L" ? 0 : 0, y = 0; let planted = true;
        for (let s = first; s < steps; s += 2) {
          const t0 = s * sd, t1 = t0 + sd * 0.95;
          const zTarget = Math.min((s + 1) * stepLen, steps * stepLen), yTarget = rise ? Math.min(s + 1, steps) * rise : 0;
          if (tt >= t1) { z = zTarget; y = yTarget; }
          else if (tt > t0) { const e = smooth((tt - t0) / (t1 - t0)); const z0 = z, y0 = y; z = lerp(z0, zTarget, e); y = lerp(y0, yTarget, e) + (rise ? Math.max(rise, 0) * 0.9 + 1.0 : 1.4) * Math.sin(Math.PI * e); planted = false; break; }
        }
        return { p: [x, y, z + (opts.z0 || 0)], planted };
      };
      const fL = footPos("L", t), fR = footPos("R", t);
      const comZ = (fL.p[2] + fR.p[2]) / 2 + stepLen * 0.15, comY = rise ? Math.max(Math.min(fL.p[1], fR.p[1]), (fL.p[1] + fR.p[1]) / 2 - Math.abs(rise) * 0.3) : 0;
      let py = 0; py = pelvisFor([{ p: vsub(fL.p, [0, comY, comZ]) }, { p: vsub(fR.p, [0, comY, comZ]) }], 7.85);
      const u = upper(t, dur);
      return Object.assign({ pelvis: [0, comY + py, comZ], legs: { L: { foot: fL.p }, R: { foot: fR.p } }, footL: fL.planted, footR: fR.planted, sw: 1 }, u);
    } }));
  };
  const ready = (t, dur) => {   // weapon up at the shoulder (entering a room), head scanning
    const w = smooth(t / 0.5);
    const torso = vlerp(carryTorso, [AT[0] + 0.1, AT[1], 0], w);
    return { torso, rootRot: [0, A.rootYaw * w, 0], head: [A.head[0], A.head[1] * w + 0.2 * Math.sin(t * 3), 0], wpn: blendPlacement(carryT, aimP(torso), w) };
  };
  // doorway at clip z = 1.6 m; 4 steps of 0.45 m (approach slows, steps through)
  walkRM("enter_building", 2.4, 4, 0.48 / V_M, ready, 0, [{ t: 0, type: "footstep", foot: "L" }, { t: 0.6, type: "footstep", foot: "R" }, { t: 1.2, type: "footstep", foot: "L" }, { t: 1.5, type: "door", z: 1.2 }, { t: 1.8, type: "footstep", foot: "R" }]);
  walkRM("exit_building", 2.4, 4, 0.48 / V_M, (t, dur) => { const w = 1 - smooth((t - 1.4) / 0.8); const torso = vlerp(carryTorso, [AT[0] + 0.1, AT[1], 0], w); return { torso, rootRot: [0, A.rootYaw * w, 0], head: [carryHead[0], A.head[1] * w + 0.45 * Math.sin(t * 2.6), 0], wpn: blendPlacement(carryT, aimP(torso), w) }; },
    0, [{ t: 0.6, type: "footstep", foot: "L" }, { t: 0.9, type: "door", z: 0.6 }, { t: 1.2, type: "footstep", foot: "R" }]);
  // stairs: 0.175 m rise, 0.28 m tread; one step per foot per cycle (2 steps, 1.0 s) — loop with root motion
  const RISE = 0.175 / V_M, TREAD = 0.28 / V_M;
  const stairUpper = (t) => { const torso = [carryTorso[0] + 0.18, carryTorso[1], 0]; return { torso, head: [carryHead[0] + 0.15, carryHead[1], 0], wpn: carryT }; };
  for (const [nm, r] of [["stairs_up", RISE], ["stairs_down", -RISE]]) {
    add(cls, nm, { duration: 1.0, loop: true, rootMotion: true, checkGround: false, stairs: { rise: 0.175, tread: 0.28 }, events: [{ t: 0, type: "footstep", foot: "L" }, { t: 0.5, type: "footstep", foot: "R" }],
      deltaOverride: [0, +(2 * r * V_M).toFixed(5), +(2 * TREAD * V_M).toFixed(5), 0],
      gen: t => {
        // left foot on step 1 at t=0 (planted), right foot swings from step -1 to step 1 ... continuous cycle in clip space
        const u = t / 1.0;
        const footAt = (side, uu) => {   // side L: plants at u=0 on step 2k (k = cycle), R at 0.5 on step 2k+1
          const off = side === "L" ? 0 : 0.5; let v = uu - off; const k = Math.floor(v); const f = v - k;
          const swing = 0.42;   // last 42 % of the cycle is the swing to the next-next step
          const s0 = 2 * k + (side === "L" ? 0 : 1), s1 = s0 + 2;
          const x = side === "L" ? 1.5 : -1.5;
          const pos = s => [x, s * r, s * TREAD + TREAD * 0.5];
          if (f < 1 - swing) return { p: pos(s0), planted: true };
          const e = smooth((f - (1 - swing)) / swing);
          const p0 = pos(s0), p1 = pos(s1);
          return { p: [x, lerp(p0[1], p1[1], e) + (Math.abs(r) + 0.9) * Math.sin(Math.PI * e) * (r > 0 ? 1 : 0.6), lerp(p0[2], p1[2], e)], planted: false };
        };
        const fL = footAt("L", u), fR = footAt("R", u);
        const comZ = u * 2 * TREAD + TREAD * 0.5, comY = u * 2 * r + (r > 0 ? 0 : r);
        const lo = Math.min(fL.p[1], fR.p[1]);
        let py = pelvisFor([{ p: vsub(fL.p, [0, comY, comZ]) }, { p: vsub(fR.p, [0, comY, comZ]) }], 7.85);
        return Object.assign({ pelvis: [0, comY + py, comZ], legs: { L: { foot: fL.p }, R: { foot: fR.p } }, footL: fL.planted, footR: fR.planted, sw: 1 }, stairUpper(t));
      } });
  }

  // ---- parachute: descent (loop), land (PLF), recover
  const sockClip = fr => socketClip(fr, PARA_SOCKET);
  const PEND = 6.2 / V_M, SWAY = 0.1, PER = 4.8;   // pendulum length (V), amplitude (rad), period (s)
  const riserL = [1.7, 10.2, -0.3], riserR = [-1.7, 10.2, -0.3];   // torso space hand targets on the risers
  const hangLegs = { L: { thigh: [-0.22, 0, 0.04], shin: [0.32, 0, 0] }, R: { thigh: [-0.22, 0, -0.04], shin: [0.32, 0, 0] } };
  const descentSpec = t => {
    const a = SWAY * Math.sin(t / PER * Math.PI * 2), b = 0.45 * SWAY * Math.sin(t / PER * Math.PI * 2 + 1.3);
    const rootRot = [b, 0, a];
    // pendulum about a pivot PEND above the socket: socket = pivot + R*(0,-PEND,0)  -> root so that the socket lands there
    const R = eulerMat(rootRot);
    const pivot = vadd(PARA_SOCKET, [0, PEND, 0]);
    const sockW = vadd(pivot, mvec(R, [0, -PEND, 0]));
    const pel = vsub(sockW, mvec(R, PARA_SOCKET));
    const kick = 0.08 * Math.sin(t / PER * Math.PI * 4);
    return { torso: [0.02, 0, 0], head: [-0.15, 0.2 * Math.sin(t / PER * Math.PI * 2 + 2), 0], pelvis: pel, rootRot,
      legs: { L: { thigh: [hangLegs.L.thigh[0] + kick, 0, 0.04], shin: [0.32 - kick, 0, 0] }, R: { thigh: [hangLegs.R.thigh[0] + kick, 0, -0.04], shin: [0.32 - kick, 0, 0] } },
      slung: true, wpn: slungPlacement(cls), leftT: riserL, rightT: riserR, poleL: [1, 0, -0.3], poleR: [-1, 0, -0.3], sw: 0 };
  };
  const canopyBreath = t => [1 + 0.035 * Math.sin(t / 1.2 * Math.PI * 2), 1 - 0.025 * Math.sin(t / 1.2 * Math.PI * 2)];
  add(cls, "para_descent", { duration: PER, loop: true, descentSpeed: 5.0, checkGround: false, gen: descentSpec,
    canopyFn: (t, fr) => { const br = canopyBreath(t); return canopyFrame(sockClip(fr), fr.rootRot.map((v, i) => v * 0.85), br[0], br[1], false, 0); } });
  // land: t=0 touchdown with descent pose (feet together) -> knees flex -> topple to the right side -> roll on the back
  const LAND = 1.5, LAND_OFF = [-3.0, 0, -1.0];   // PLF end displacement (V) = para_land delta
  const landSpec = t => {
    const c1 = smooth(t / 0.22), c2 = smooth((t - 0.12) / 0.5), c3 = smooth((t - 0.55) / 0.6);
    const d = descentSpec(0);
    return { torso: [0.02 + 0.45 * c1 - 0.3 * c3, -0.2 * c2, 0.2 * c2], head: [-0.15 + 0.5 * c1 - 0.2 * c3, 0.3 * c2, 0], pelvis: [-2.0 * c2 - 1.0 * c3, lerp(0, -3.2, c1) * (1 - c2), -1.0 * c3],
      rootRot: [-0.6 * c3, 0.3 * c2, -1.35 * c2 + 0.25 * c3],
      legs: { L: { thigh: [lerp(-0.22, -1.1, c1) + 0.3 * c3, 0, 0.04], shin: [lerp(0.32, 1.9, c1) - 0.5 * c3, 0, 0] }, R: { thigh: [lerp(-0.22, -1.05, c1) + 0.3 * c3, 0, -0.04], shin: [lerp(0.32, 1.85, c1) - 0.5 * c3, 0, 0] } },
      slung: true, wpn: slungPlacement(cls), leftT: vlerp(riserL, [1.4, 6.5, 2.6], c2), rightT: vlerp(riserR, [-1.2, 6.8, 2.6], c2), poleL: [1, -0.5, -0.3], poleR: [-1, -0.5, -0.3], sw: 0,
      ground: c1 > 0.05 ? Math.min(1, c2 * 1.6 + 0.3) : 0, footL: t < 0.1, footR: t < 0.1 };
  };
  // canopy after touchdown: keeps sinking (height scale), deflates, topples behind-left; pivot follows the harness, then rests
  const canopyLand = (t, sock) => {
    const sink = smooth(t / 1.6), top = smooth((t - 0.4) / 1.8), br = canopyBreath(0);
    // collapse: the dome flattens onto the lines' slack (height) and is carried downwind (shear: behind-left), lines stay on the harness
    return canopyFrame(sock, [0.12 * top, 0, -0.08 * top], lerp(br[0], 0.8, smooth(t / 2.4)), lerp(br[1], 0.1, sink), true, [0.3 * top, -0.75 * top]);
  };
  add(cls, "para_land", { duration: LAND, loop: false, rootMotion: true, events: [{ t: 0, type: "touchdown" }, { t: 0.55, type: "body_fall" }, { t: 1.4, type: "canopy_ground" }], gen: landSpec,
    canopyFn: (t, fr) => canopyLand(t, sockClip(fr)) });
  // recover: from the PLF end pose: roll to the knees, release the harness, stand, draw the weapon to carry (ends = idle frame 0)
  const REC = 3.2, rel = 1.25, draw = 2.15;
  let releaseSock = null;
  add(cls, "para_recover", { duration: REC, loop: false, rootMotion: true, events: [{ t: rel, type: "harness_release" }, { t: draw, type: "weapon_draw" }],
    gen: t => {
      const e = landSpec(LAND); e.pelvis = vsub(e.pelvis, LAND_OFF);   // recover's clip space starts where para_land's delta put the agent
      const k1 = smooth(t / 0.8), k2 = smooth((t - 0.8) / 0.5), k3 = smooth((t - 1.5) / 0.7), k4 = smooth((t - 1.9) / 0.5), k5 = smooth((t - 2.3) / 0.8);
      // phase 1: roll from the back/side onto the knees (root rotation -> 0, kneel pose)
      const rr = e.rootRot.map(v => v * (1 - k1));
      const kneelP = [0, -3.55, -0.3], standP = [0.0, -0.15, 0];
      const off = [0, 0, 0];
      const pel = vadd(vlerp(vlerp(e.pelvis, vadd(off, kneelP), k1), vadd(off, standP), k3), [0, 0, 0]);
      const legs = k3 < 0.02 ? { L: k1 > 0.6 ? { foot: vadd(off, [1.7, 0, 3.6]) } : { thigh: vlerp(e.legs.L.thigh, [-1.4, 0, 0.1], k1), shin: vlerp(e.legs.L.shin, [1.45, 0, 0], k1) },
                                 R: k1 > 0.98 ? { foot: vadd(off, KNEEL_R) } : { thigh: vlerp(e.legs.R.thigh, [0.08, 0, -0.05], k1), shin: vlerp(e.legs.R.shin, [1.62, 0, 0], k1) } }
                             : { L: { foot: vadd(off, vadd(vlerp([1.7, 0, 3.6], stanceL, k3), [0, 1.2 * Math.sin(Math.PI * k3), 0])) },
                                 R: { foot: vadd(off, vadd(vlerp(KNEEL_R, stanceR, smooth((t - 1.75) / 0.55)), [0, 1.0 * Math.sin(Math.PI * smooth((t - 1.75) / 0.55)), 0])) } };
      const torso = vlerp(vlerp(e.torso, [0.35, 0, 0], k1), carryTorso, k3);
      // hands: to the chest (harness release) then right hand to the slung weapon, draw, carry
      const relT = [0.2, 3.8, 2.8];
      let leftT = vlerp(vlerp(e.leftT, relT, smooth((t - 0.6) / 0.5)), [1.6, 0.6, 2.4], smooth((t - rel) / 0.4));
      let rightT = vlerp(vlerp(e.rightT, vadd(relT, [-0.5, 0.2, 0]), smooth((t - 0.6) / 0.5)), [0.2, 3.0, 3.6], smooth((t - rel - 0.2) / 0.6));
      const S = { torso, head: vlerp(e.head, carryHead, k3), pelvis: pel, rootRot: rr, legs, footL: (k1 >= 0.999 && k3 <= 0) || k3 >= 1, footR: t >= 2.3, ground: k3 > 0.01 ? 0 : 1, poleL: [1, -0.5, -0.3], poleR: [-1, -0.5, -0.3] };
      if (t < draw) { S.slung = true; S.wpn = slungPlacement(cls); S.leftT = leftT; S.rightT = rightT; S.sw = 0; }
      else { S.wpn = blendPlacement(slungPlacement(cls), carryT, k5); S.sw = k5; S.leftT = leftT; }
      return S;
    },
    canopyFn: (t, fr) => {
      // the canopy lies where para_land left it; after the release its pivot drops to the ground
      const endLand = canopyLand(10, [0, 0, 0]);
      if (!releaseSock || t === 0) releaseSock = null;
      const sk = sockClip(fr);
      if (t <= rel) releaseSock = sk;
      const p = t <= rel ? sk : vlerp(releaseSock, [releaseSock[0], 0.06, releaseSock[2]], smooth((t - rel) / 0.5));
      const f = canopyLand(LAND + t, p); return f;
    } });
}

// supply crate: descent (loop) + land
function authorCrate(add) {
  const PER = 3.2, SW = 0.07, PEND = 3.0;
  const crateDesc = t => { const a = SW * Math.sin(t / PER * Math.PI * 2), b = 0.5 * SW * Math.sin(t / PER * Math.PI * 2 + 1.1); return { rot: [b, 0.1 * Math.sin(t / PER * Math.PI * 2), a] }; };
  const SOCK = [-0.025, 0.9, -0.025];
  const crateFrame = (rot, pos) => [pos[0], pos[1], pos[2], rot[0], rot[1], rot[2]];
  const descPose = t => { const r = crateDesc(t).rot, R = eulerMat(r); const pivot = [0, 0.9 + PEND, 0]; const sock = vadd(pivot, mvec(R, [0, -PEND, 0])); const pos = vsub(sock, mvec(R, SOCK)); return { pos, rot: r, sock }; };
  add("crate", "descent", { cls: "crate", duration: PER, loop: true, descentSpeed: 6.0, crateFn: t => { const d = descPose(t); return crateFrame(d.rot, d.pos); },
    canopyFn: t => { const d = descPose(t); return canopyFrame(d.sock, d.rot, 1 + 0.03 * Math.sin(t / 0.9 * Math.PI * 2), 1 - 0.02 * Math.sin(t / 0.9 * Math.PI * 2), false, 0); } });
  const LAND = 3.5;
  const landPose = t => {
    const bounce = t < 0.06 ? 0 : (t < 0.42 ? 0.12 * Math.sin(Math.PI * (t - 0.06) / 0.36) : (t < 0.62 ? 0.03 * Math.sin(Math.PI * (t - 0.42) / 0.2) : 0));
    const tilt = 0.06 * Math.sin(Math.min(1, t / 0.5) * Math.PI) * Math.exp(-t * 2) + 0.025 * smooth(t / 0.7);
    const rot = [tilt, 0, -0.5 * tilt];
    const lift = 0.55 * Math.abs(Math.sin(rot[0])) + 0.38 * Math.abs(Math.sin(rot[2]));   // keep the low skid edge on the ground
    return { pos: [0, bounce + lift, 0], rot };
  };

    ["root motion", c.delta ? c.delta.map(v => v.toFixed(2)).join(" ") : "-"], ["foot slide (max)", (c.stats.footSlide * 100).toFixed(1) + " cm"], ["support err", (c.stats.supportError * 100).toFixed(2) + " cm"], ["t", anim.t.toFixed(2)]]
    : [["scene", anim.scene], ["t", anim.t.toFixed(2) + " s"]];
  rows.push(["bake", animMs.toFixed(0) + " ms, " + AN.clips.length + " clips"]);
  el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}

// ---- UI
const groupsUI = [["Infantry", LIB.infantry], ["Drops & supply", LIB.props.filter(p => p.cat === "drop" || p.cat === "supply")], ["Walls", LIB.props.filter(p => p.cat === "wall")],
  ["Fortification", LIB.props.filter(p => p.cat === "fort")], ["Barricades", LIB.props.filter(p => p.cat === "barricade")], ["Garrison", LIB.props.filter(p => p.cat === "garrison")], ["Hospital", LIB.props.filter(p => p.cat === "hospital")]];
const listEl = document.getElementById("assets");
listEl.innerHTML = groupsUI.map(([n, l]) => `<div class="grp"><b>${n}</b><div class="chips">${l.map(m => `<button class="chip" data-a="${m.name}" aria-pressed="${m.name === state.asset}">${m.label.replace(/^(Gabion|Reinforced) wall /, "$1 ")}</button>`).join("")}</div></div>`).join("");
listEl.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b) return; state.asset = b.dataset.a; state.mode = "single"; syncUI(); rebuild(); });
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const g = seg.dataset.group; state[g] = b.dataset.v;
  if (g === "light") setLight(b.dataset.v); else rebuild();
  syncUI();
}));
document.getElementById("zombie").addEventListener("change", e => { state.zombie = e.target.checked; rebuild(); });
document.getElementById("points").addEventListener("change", e => { state.points = e.target.checked; rebuild(); });
document.getElementById("open").addEventListener("change", e => { state.open = e.target.checked; rebuild(); });
function syncUI() {
  document.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(state[seg.dataset.group] === b.dataset.v))));
  listEl.querySelectorAll("[data-a]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.a === state.asset)));
}
// ---- animation UI
const actEl = document.getElementById("animActions");
actEl.innerHTML = ACTIONS.map(a => `<button class="chip" data-act="${a}" aria-pressed="${a === anim.action}">${a.replace(/_/g, " ")}</button>`).join("");
actEl.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b) return; anim.action = b.dataset.act; anim.t = 0; anim.scene = "classes"; syncAnimUI(); if (anim.scene !== "classes") rebuild(); else { buildAnimScene(); frameAnim(); } });
document.getElementById("animScene").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; anim.scene = b.dataset.s; anim.t = 0; syncAnimUI(); rebuild(); });
document.getElementById("animCls").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; anim.cls = b.dataset.c; anim.scene = "classes"; syncAnimUI(); rebuild(); });
document.getElementById("animPlay").addEventListener("click", () => { anim.playing = !anim.playing; syncAnimUI(); });
document.getElementById("animRestart").addEventListener("click", () => { anim.t = 0; for (const a of actors) clearMarks(a); });
document.getElementById("animSpeed").addEventListener("change", e => { anim.speed = +e.target.value; });
document.getElementById("animLoop").addEventListener("change", e => { anim.loop = e.target.checked; });
document.getElementById("animTravel").addEventListener("change", e => { anim.travel = e.target.checked; rebuild(); });
document.getElementById("animFx").addEventListener("change", e => { anim.fx = e.target.checked; });
document.getElementById("animScrub").addEventListener("input", e => {
  const c = CLIP[(actors[0] ? actors[0].cls : "rifleman") + "/" + anim.action] || CLIP["rifleman/idle"];
  anim.playing = false; anim.t = anim.scene === "classes" ? (+e.target.value / 1000) * c.duration : (+e.target.value / 1000) * 16; syncAnimUI();
});
function syncAnimUI() {
  actEl.querySelectorAll("[data-act]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.act === anim.action)));
  document.querySelectorAll("#animScene [data-s]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === anim.scene)));
  document.querySelectorAll("#animCls [data-c]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === anim.cls)));
  document.getElementById("animPlay").textContent = anim.playing ? "Pause" : "Play";
  document.getElementById("animClip").textContent = anim.scene === "classes" ? anim.action : anim.scene;
}
// ---- JSON export: every model's parts as voxel lists (palette indices), plus rig data
function exportJSON() {
  const enc = p => ({ name: p.name, parent: p.parent || null, slot: p.slot || null, unit: +(p.set.size * p.unitM).toFixed(6), pivot: p.pivot, weaponSpace: !!p.weaponSpace,
                      cellSize: p.set.size, voxels: [...p.set.map.values()].map(c => [c.x, c.y, c.z, PAL[c.m]]) });
  return { format: "military_lab_v1", palette: PALETTE.filter(p => !p.name.startsWith("z_")), infantry: LIB.infantry.map(m => ({ name: m.name, label: m.label, cls: m.cls, unitM: m.unitM, weapon: m.weapon, poses: m.poses, sockets: m.sockets, parts: m.parts.map(enc) })),
           props: LIB.props.map(m => ({ name: m.name, label: m.label, cat: m.cat, sockets: m.sockets, parts: m.parts.map(enc) })) };
}
document.getElementById("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(exportJSON())], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "military_models_v1.json"; a.click();
});
// ---- loop
function resize() { const w = stageEl.clientWidth, h = stageEl.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener("resize", resize);
const v3 = new THREE.Vector3();
let lastFrameT = performance.now();
function loop() {
  const now = performance.now(), dt = Math.min(0.1, (now - lastFrameT) / 1000); lastFrameT = now;
  animUpdate(dt);
  controls.update();
  const c = controls.target; key.position.set(c.x + 6, c.y + 10, c.z + 5); key.target.position.copy(c); fill.position.set(c.x - 6, c.y + 3, c.z - 5); lamp.position.set(c.x + 1.5, c.y + 2.5, c.z + 1.5);
  const span = Math.max(4, camera.position.distanceTo(c) * 0.7); const sc = key.shadow.camera; sc.left = sc.bottom = -span; sc.right = sc.top = span; sc.near = 0.1; sc.far = 80; sc.updateProjectionMatrix();
  renderer.render(scene, camera);
  // labels
  if (state.mode === "lineup" || state.mode === "props" || state.mode === "speclineup") {
    if (labelsEl.childElementCount !== shown.filter(s => s.label).length) labelsEl.innerHTML = shown.filter(s => s.label).map(() => '<div class="tag"></div>').join("");
    let i = 0;
    for (const o of shown) if (o.label) {
      const b = new THREE.Box3().setFromObject(o.root); v3.set((b.min.x + b.max.x) / 2, b.min.y, b.max.z + 0.1).project(camera);
      const el = labelsEl.children[i++]; el.textContent = o.label; el.style.left = ((v3.x + 1) / 2 * stageEl.clientWidth) + "px"; el.style.top = ((1 - v3.y) / 2 * stageEl.clientHeight + 6) + "px";
    }
  }
  requestAnimationFrame(loop);
}
resize(); setLight("neutral"); rebuild(); loop();
window.__mil = { state, rebuild, setLight, syncUI, exportJSON, LIB, SPEC, AN2, CLIP, ALL, camera, controls, scene, renderer, frame, bounds, shown: () => shown, ready: true,
  set(o) { Object.assign(state, o); if (o.light) setLight(o.light); syncUI(); rebuild(); },
  AN, anim, setAnim(o) { Object.assign(anim, o); syncAnimUI(); if (state.mode === "anim") { rebuild(); } },
  step(dt) { animUpdate(dt); controls.update(); renderer.render(scene, camera); },
  animAt(t) { anim.t = t; anim.playing = false; for (const a of actors) { a.blend = 1; a.prev = null; } animUpdate(0); renderer.render(scene, camera); } };
})();
</script>
